<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="General – AI assistant with Wikipedia, web search, weather, definitions, news, and LLM. Chat and attach PDFs or images." />
  <title>General</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Base tokens — Blue & White ─────────────────────── */
    :root {
      --bg: #ffffff;
      --surface: #f0f6ff;
      --surface-hover: #dbeafe;
      --border: rgba(37,99,235,0.1);
      --border-solid: #bfdbfe;
      --text: #0f172a;
      --text-soft: #1e3a5f;
      --text-dim: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37,99,235,0.1);
      --accent-soft2: rgba(37,99,235,0.06);
      --user-bg: #dbeafe;
      --user-border: #bfdbfe;
      --radius: 12px;
      --radius-lg: 18px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
      --sidebar-w: 268px;
      --transition: 0.18s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-hover: #263348;
        --border: rgba(96,165,250,0.12);
        --border-solid: #334155;
        --text: #f1f5f9;
        --text-soft: #cbd5e1;
        --text-dim: #64748b;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --accent-soft: rgba(96,165,250,0.15);
        --accent-soft2: rgba(96,165,250,0.07);
        --user-bg: #1e3a5f;
        --user-border: #2563eb;
      }
    }

    /* ─── Reset & base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ─── Layout shell ────────────────────────────────────── */
    .shell {
      display: flex; height: 100vh; height: 100dvh;
      overflow: hidden;
      position: relative;
    }
    @supports not (height: 100dvh) {
      .shell { height: calc(var(--vh, 1vh) * 100); }
    }

    .history-rail {
      width: 56px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.9rem;
      background: var(--surface);
      border-right: 1px solid var(--border-solid);
      z-index: 11;
    }

    /* ─── Sidebar — always a hidden drawer ───────────────── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w); max-width: 85vw;
      display: flex; flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border-solid);
      box-shadow: 4px 0 32px rgba(37,99,235,0.08), 2px 0 12px rgba(0,0,0,0.06);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      z-index: 50;
      will-change: transform;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border-solid);
      gap: 0.5rem;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text);
    }
    .sidebar-brand img {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; min-width: 36px;
      background: none; border: none; border-radius: var(--radius);
      color: var(--text-dim); cursor: pointer;
      transition: background var(--transition), color var(--transition);
      touch-action: manipulation;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--accent); }
    .icon-btn svg { width: 17px; height: 17px; }

    .sidebar-body {
      flex: 1; min-height: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0.6rem 0.6rem;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 99px; }

    .sidebar-section-title {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text-dim);
      padding: 0.5rem 0.6rem 0.3rem;
    }
    .chat-item {
      display: flex; align-items: center;
      padding: 0.55rem 0.7rem; border-radius: var(--radius);
      cursor: pointer; font-size: 0.84rem; color: var(--text-soft);
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
      gap: 0.5rem;
    }
    .chat-item:hover { background: var(--surface-hover); color: var(--accent); }
    .chat-item svg { flex-shrink: 0; width: 14px; height: 14px; opacity: 0.4; }
    .chat-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item-date { font-size: 0.7rem; color: var(--text-dim); flex-shrink: 0; }
    .sidebar-empty { padding: 0.75rem 0.7rem; font-size: 0.82rem; color: var(--text-dim); }

    .sidebar-footer {
      flex-shrink: 0; padding: 0.65rem 0.65rem;
      border-top: 1px solid var(--border-solid);
    }
    .new-chat-btn {
      width: 100%; display: flex; align-items: center; gap: 0.55rem;
      padding: 0.65rem 0.9rem; min-height: 42px;
      background: var(--accent); border: none; border-radius: var(--radius);
      font: inherit; font-size: 0.87rem; font-weight: 600; color: #fff;
      cursor: pointer; transition: all var(--transition); touch-action: manipulation;
    }
    .new-chat-btn:hover { background: var(--accent-hover); }
    .new-chat-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ─── Sidebar overlay ─────────────────────────────────── */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.4); z-index: 40;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .sidebar-overlay.visible { display: block; }

    /* ─── Main area ───────────────────────────────────────── */
    .main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    /* ─── Top bar ─────────────────────────────────────────── */
    .topbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.1rem;
      background: var(--bg);
      position: relative; z-index: 10;
    }
    .topbar-title {
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); letter-spacing: -0.025em;
      display: flex; align-items: center; gap: 0.45rem;
    }
    .topbar-title .logo-img {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .topbar-spacer { flex: 1; }
    .lang-toggle {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.32rem 0.7rem; font: inherit;
      font-size: 0.77rem; font-weight: 600; color: var(--text-dim);
      background: none; border: 1px solid var(--border-solid); border-radius: 99px;
      cursor: pointer; transition: all var(--transition);
    }
    .lang-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .lang-toggle svg { width: 13px; height: 13px; }

    /* ─── Chat scroll area ────────────────────────────────── */
    .chat-scroll {
      flex: 1; min-height: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      background: none;
    }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 99px; }

    /* ─── Welcome state ───────────────────────────────────── */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%;
      padding: 2.5rem 1.5rem 1rem;
      text-align: center;
      animation: fade-in 0.4s ease both;
    }
    .welcome-icon-wrap {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--accent) 0%, #60a5fa 100%);
      border-radius: 20px; margin-bottom: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(37,99,235,0.25);
    }
    .welcome-icon-wrap img {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .welcome-title {
      font-size: 1.75rem; font-weight: 700;
      letter-spacing: -0.04em; color: var(--text);
      margin: 0 0 0.4rem;
    }
    .welcome-sub {
      font-size: 0.93rem; color: var(--text-dim);
      margin: 0 0 2rem; max-width: 380px; line-height: 1.55;
    }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      max-width: 540px; width: 100%;
    }
    @media (max-width: 480px) {
      .suggestions { grid-template-columns: repeat(2, 1fr); max-width: 340px; }
    }
    .suggestion-card {
      background: var(--bg);
      border: 1.5px solid var(--border-solid);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      text-align: left; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      font-size: 0.85rem; color: var(--text-soft);
      line-height: 1.45;
      display: flex; flex-direction: column; gap: 0.5rem;
      box-shadow: 0 1px 4px rgba(37,99,235,0.04);
    }
    .suggestion-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.12);
    }
    .suggestion-card:active { transform: translateY(0); }
    .s-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .s-icon-wrap svg { width: 18px; height: 18px; }
    .s-icon-wrap.news    { background: #eff6ff; color: #2563eb; }
    .s-icon-wrap.robot   { background: #f0fdf4; color: #16a34a; }
    .s-icon-wrap.weather { background: #fefce8; color: #ca8a04; }
    .s-icon-wrap.email   { background: #fdf4ff; color: #9333ea; }
    @media (prefers-color-scheme: dark) {
      .s-icon-wrap.news    { background: rgba(37,99,235,0.2);  color: #93c5fd; }
      .s-icon-wrap.robot   { background: rgba(22,163,74,0.2);  color: #86efac; }
      .s-icon-wrap.weather { background: rgba(202,138,4,0.2);  color: #fde047; }
      .s-icon-wrap.email   { background: rgba(147,51,234,0.2); color: #d8b4fe; }
    }
    .s-text { font-weight: 600; font-size: 0.84rem; color: var(--text); }
    .s-sub  { font-size: 0.76rem; color: var(--text-dim); font-weight: 400; }

    /* Voice CTA on welcome screen */
    .voice-cta {
      display: none; /* shown only when SR available */
      align-items: center; gap: 0.6rem;
      padding: 0.7rem 1.4rem;
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      font: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
      margin-top: 1.4rem;
      margin-bottom: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37,99,235,0.18);
    }
    .voice-cta:hover {
      background: var(--accent-soft2);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(37,99,235,0.28);
    }
    .voice-cta:active { transform: translateY(0); }
    .voice-cta svg { width: 18px; height: 18px; }
    .voice-cta.sr-ready { display: flex; }

    /* ─── Messages ─────────────────────────────────────────── */
    .chat-inner {
      max-width: 720px; margin: 0 auto;
      padding: 1.5rem 1.25rem 0.5rem;
      width: 100%;
    }
    @media (max-width: 767px) {
      .chat-inner { padding: 1rem 0.75rem 0.25rem; }
    }

    .msg-row {
      display: flex; gap: 0.75rem;
      padding: 0.6rem 0;
      animation: msg-in 0.22s ease both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; min-width: 30px;
      border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar.ai-avatar {
      background: #ffffff;
      border: 1px solid var(--border-solid);
      box-shadow: 0 4px 14px rgba(15,23,42,0.12);
      color: var(--accent);
    }
    .msg-avatar.ai-avatar img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .msg-avatar.user-avatar {
      display: none;
    }

    .msg-bubble {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
    }
    .msg-row.user .msg-bubble { align-items: flex-end; }

    .msg-name {
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-dim); margin-bottom: 0.25rem;
      letter-spacing: 0.01em;
    }

    .msg-content {
      display: inline-block;
      font-size: 0.97rem; line-height: 1.7;
      color: var(--text-soft);
      max-width: 100%;
    }
    .msg-row.user .msg-content {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-radius: 18px 18px 4px 18px;
      padding: 0.65rem 1rem;
      white-space: pre-wrap; word-break: break-word;
      color: var(--text);
      max-width: 85%;
    }
    .msg-row.ai .msg-content {
      background: none; padding: 0;
      border-radius: 0;
      max-width: 100%;
    }

    /* Message content markdown styling */
    .msg-content p { margin: 0 0 0.65em; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 700; color: var(--text); }
    .msg-content em { font-style: italic; }
    .msg-content code {
      font-family: var(--mono); font-size: 0.84em;
      background: var(--surface-hover); color: var(--accent);
      padding: 0.1em 0.35em; border-radius: 5px;
    }
    .msg-content pre {
      margin: 0.6em 0; padding: 0.85em 1em;
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); overflow-x: auto;
      font-family: var(--mono); font-size: 0.84em;
      white-space: pre-wrap;
    }
    .msg-content pre code { background: none; padding: 0; color: var(--text-soft); }
    .msg-content a { color: var(--accent); text-decoration: none; font-weight: 500; border-bottom: 1px solid rgba(37,99,235,0.25); transition: all var(--transition); }
    .msg-content a:hover { border-bottom-color: var(--accent); }
    .msg-content ul, .msg-content ol { margin: 0.4em 0; padding-left: 1.4em; }
    .msg-content li { margin-bottom: 0.2em; }
    .msg-content .msg-heading { display: block; font-weight: 700; font-size: 1.02em; color: var(--text); margin: 0.7em 0 0.2em; }
    .msg-content .msg-heading:first-child { margin-top: 0; }

    /* Snippet card */
    .ai-snippet {
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); margin: 0.6em 0;
      overflow: hidden;
    }
    .ai-snippet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.8rem;
      background: var(--surface-hover); border-bottom: 1px solid var(--border-solid);
      font-size: 0.72rem; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .ai-snippet-copy {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); padding: 0.15rem 0.3rem; border-radius: 4px;
      font-size: 0.8rem; line-height: 1; display: flex; align-items: center;
      transition: all var(--transition);
    }
    .ai-snippet-copy:hover { background: var(--border-solid); color: var(--text); }
    .ai-snippet-copy.copied { color: var(--accent); }
    .ai-snippet-body pre {
      margin: 0 !important; border: none !important; border-radius: 0 !important;
      background: transparent !important; padding: 0.75rem 1rem !important;
    }

    /* Table */
    .table-wrap { overflow-x: auto; margin: 0.6em 0; border-radius: var(--radius); border: 1px solid var(--border-solid); }
    .msg-content table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    .msg-content th, .msg-content td { padding: 0.45em 0.75em; text-align: left; border-bottom: 1px solid var(--border-solid); }
    .msg-content th { font-weight: 700; color: var(--text); background: var(--surface); }
    .msg-content tbody tr:last-child td { border-bottom: none; }

    /* Attachment badge */
    .attach-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.28rem 0.55rem; margin-top: 0.35rem;
      background: var(--surface); border: 1px solid var(--border-solid); border-radius: 99px;
      font-size: 0.75rem; color: var(--text-dim); font-weight: 500;
    }
    .attach-badge svg, .attach-badge img { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; }

    /* Message actions */
    .msg-actions {
      display: flex; gap: 0.25rem;
      margin-top: 0.35rem;
      opacity: 0; transition: opacity var(--transition);
    }
    .msg-row:hover .msg-actions,
    .msg-row:focus-within .msg-actions { opacity: 1; }
    .msg-row.user .msg-actions { flex-direction: row-reverse; }
    .action-btn {
      display: flex; align-items: center; gap: 0.3rem;
      padding: 0.22rem 0.5rem; background: none; border: 1px solid var(--border-solid);
      border-radius: 99px; font: inherit; font-size: 0.75rem; font-weight: 500;
      color: var(--text-dim); cursor: pointer; transition: all var(--transition);
      line-height: 1;
    }
    .action-btn:hover { background: var(--surface-hover); color: var(--text); }
    .action-btn.copied { color: var(--accent); border-color: var(--accent); }
    .action-btn svg { width: 12px; height: 12px; }

    /* ─── Streaming cursor ────────────────────────────────── */
    .msg-content.streaming::after {
      content: "▋"; color: var(--accent);
      animation: blink-cursor 0.8s step-end infinite;
    }
    @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ─── Typing indicator ───────────────────────────────── */
    .typing-dots {
      display: inline-flex; gap: 4px; align-items: center;
      padding: 0.1em 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── Voice buttons ───────────────────────────────────── */
    .mic-btn.listening {
      color: #ef4444 !important; border-color: #ef4444 !important;
      background: rgba(239,68,68,0.08) !important;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.35); }
      50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
    }
    .voice-mode-btn.active {
      color: var(--accent) !important; border-color: var(--accent) !important;
      background: var(--accent-soft) !important;
    }
    .no-speech .mic-btn, .no-speech .voice-mode-btn { display: none !important; }

    /* ─── Form area ───────────────────────────────────────── */
    .form-area {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem 1rem;
      background: var(--bg);
      position: relative; z-index: 10;
    }
    /* fade from transparent to bg above the form */
    .form-area::before {
      content: ""; pointer-events: none;
      position: absolute; top: -32px; left: 0; right: 0; height: 32px;
      background: linear-gradient(to bottom, transparent, var(--bg));
    }
    .form-inner {
      max-width: 720px; margin: 0 auto;
    }

    /* file chosen */
    .file-chosen-bar {
      display: none; align-items: center; gap: 0.35rem;
      padding: 0.35rem 0.75rem; margin-bottom: 0.45rem;
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); font-size: 0.78rem; color: var(--text-dim);
      max-width: 100%;
    }
    .file-chosen-bar.visible { display: flex; }
    .file-chosen-bar .fc-name { color: var(--text-soft); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chosen-bar .fc-clear {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: var(--text-dim); padding: 0.1rem; line-height: 1; flex-shrink: 0;
      transition: color var(--transition);
    }
    .file-chosen-bar .fc-clear:hover { color: var(--text); }
    .file-chosen-bar img, .file-chosen-bar svg { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; }

    /* the input box */
    .form-box {
      display: flex; align-items: flex-end; gap: 0.4rem;
      padding: 0.6rem 0.6rem 0.6rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border-solid);
      border-radius: var(--radius-lg);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-box:focus-within {
      border-color: rgba(37,99,235,0.5);
      box-shadow: 0 2px 20px rgba(37,99,235,0.12), 0 0 0 3px rgba(37,99,235,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .form-box { box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
      .form-box:focus-within { box-shadow: 0 2px 20px rgba(96,165,250,0.2), 0 0 0 3px rgba(96,165,250,0.1); }
    }

    .form-input-wrap { flex: 1; min-width: 0; }
    #input {
      width: 100%; min-height: 26px; max-height: 200px;
      padding: 0.2rem 0; margin: 0;
      background: none; border: none; outline: none;
      color: var(--text); font: inherit; font-size: 0.97rem; line-height: 1.6;
      resize: none; overflow-y: auto;
      -webkit-text-size-adjust: 100%;
    }
    #input::placeholder { color: var(--text-dim); }

    .form-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; min-width: 36px; min-height: 36px;
      background: none; border: 1px solid var(--border-solid); border-radius: 99px;
      color: var(--text-dim); cursor: pointer; flex-shrink: 0;
      transition: all var(--transition); touch-action: manipulation;
    }
    .form-btn:hover { background: var(--surface-hover); color: var(--text); }
    .form-btn svg { width: 17px; height: 17px; }
    .form-btn.send-btn {
      background: var(--accent); border-color: var(--accent); color: #fff;
      opacity: 0; pointer-events: none;
      transform: scale(0.85);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .form-btn.send-btn.active {
      opacity: 1; pointer-events: auto; transform: scale(1);
    }
    .form-btn.send-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .form-btn.send-btn:active { transform: scale(0.93); }
    .form-btn.send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }

    .form-hint {
      text-align: center; font-size: 0.72rem; color: var(--text-dim);
      margin-top: 0.5rem;
    }

    /* ─── Mobile layout ────────────────────────────────────── */
    @media (max-width: 767px) {
      html, body { font-size: 15px; }
      .history-rail {
        width: auto;
        height: auto;
        position: fixed;
        top: calc(0.9rem + env(safe-area-inset-top, 0px));
        left: 0.5rem;
        padding: 0;
        background: transparent;
        border-right: none;
        box-shadow: none;
        z-index: 20;
      }
      .history-rail .icon-btn {
        width: auto;
        height: auto;
        min-width: 32px;
        min-height: 32px;
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border-solid);
        background: rgba(255,255,255,0.96);
      }
      .form-area { padding: 0.6rem 0.75rem calc(0.6rem + env(safe-area-inset-bottom, 0px)); }
      .chat-inner { padding: 0.75rem 0.65rem 0.25rem; }
      .form-box { border-radius: 16px; }
      .welcome { padding: 1.5rem 1rem 1rem; }
      .welcome-title { font-size: 1.45rem; }
      #input { font-size: 16px; }
    }

    /* ─── Wide desktop ─────────────────────────────────────── */
    @media (min-width: 1100px) {
      .chat-inner { max-width: 820px; }
      .form-inner { max-width: 820px; }
    }

    /* ─── Voice button in form bar ───────────────────────── */
    .voice-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: auto;
      min-width: 0;
      padding: 0 0.85rem;
      background: var(--bg) !important;
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      border-radius: 999px;
    }
    .voice-btn:hover {
      background: var(--accent-soft2) !important;
      border-color: var(--accent-hover) !important;
      color: var(--accent-hover) !important;
    }
    .voice-btn svg { width: 16px; height: 16px; }
    .voice-btn-label { font-size: 0.8rem; font-weight: 600; }
    .no-speech-hide { display: none !important; }

    /* ─── Voice overlay ───────────────────────────────────── */
    .voice-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .voice-overlay.show { display: flex !important; }

    .vo-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0c1a3a 0%, #0a0f1e 60%, #051020 100%);
    }

    .vo-body {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.5rem;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
      animation: vo-in 0.35s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    @keyframes vo-in {
      from { opacity: 0; transform: scale(0.88) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Orb */
    .vo-orb-wrap {
      position: relative;
      width: 160px; height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    .vo-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .vo-orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #2d9cdb 0%, #1a6fa8 40%, #0d4f80 100%);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 0 0 rgba(96,165,250,0);
      position: relative; z-index: 1;
    }
    .vo-orb.listening {
      animation: orb-breathe 1.8s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(96,165,250,0.45), 0 0 80px rgba(96,165,250,0.2);
    }
    .vo-orb.speaking {
      animation: orb-pulse 0.6s ease-in-out infinite alternate;
      box-shadow: 0 0 50px rgba(52,211,153,0.5), 0 0 100px rgba(52,211,153,0.2);
      background: radial-gradient(circle at 38% 35%, #34d399 0%, #059669 40%, #047857 100%);
    }
    .vo-orb.thinking {
      animation: orb-spin-glow 2s linear infinite;
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
      background: radial-gradient(circle at 38% 35%, #a78bfa 0%, #7c3aed 40%, #5b21b6 100%);
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes orb-pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.12); }
    }
    @keyframes orb-spin-glow {
      0%   { box-shadow: 0 0 30px rgba(167,139,250,0.4), 4px 0 20px rgba(167,139,250,0.25); }
      50%  { box-shadow: 0 0 40px rgba(167,139,250,0.5), -4px 0 20px rgba(167,139,250,0.25); }
      100% { box-shadow: 0 0 30px rgba(167,139,250,0.4), 4px 0 20px rgba(167,139,250,0.25); }
    }
    .vo-orb-img {
      width: 44px; height: 44px; object-fit: contain;
      filter: brightness(0) invert(1);
      border-radius: 8px;
    }

    /* State label */
    .vo-state {
      display: none; /* voice overlay is visual-only: no status text */
    }

    /* Live transcript */
    .vo-transcript {
      display: none; /* hide text transcript in speaking page */
    }
    .vo-transcript .vo-interim { color: rgba(255,255,255,0.45); }
    .vo-transcript .vo-final   { color: #fff; }

    /* Controls */
    .vo-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }
    .vo-mic-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s ease;
      backdrop-filter: blur(8px);
    }
    .vo-mic-btn svg { width: 26px; height: 26px; }
    .vo-mic-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
    .vo-mic-btn.active {
      background: rgba(96,165,250,0.25);
      border-color: rgba(96,165,250,0.7);
      color: #93c5fd;
      animation: mic-pulse-overlay 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse-overlay {
      0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); }
      50%      { box-shadow: 0 0 0 10px rgba(96,165,250,0); }
    }
    .vo-stop-btn {
      display: flex; align-items: center; gap: 0.45rem;
      padding: 0.65rem 1.35rem; border-radius: 99px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      font: inherit; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s ease;
      backdrop-filter: blur(8px);
    }
    .vo-stop-btn svg { width: 15px; height: 15px; }
    .vo-stop-btn:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); color: #fca5a5; }

    /* ─── Accessibility ────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -100px; left: 0.5rem;
      padding: 0.4rem 0.7rem; background: var(--accent); color: #fff;
      border-radius: var(--radius); font-size: 0.85rem; font-weight: 500;
      z-index: 9999; transition: top 0.2s; text-decoration: none;
    }
    .skip-link:focus { top: 0.5rem; outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  </style>
</head>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>

    <!-- ── Main area ──────────────────────────────── -->
    <div class="main">

      <!-- Top bar -->

      <!-- Chat scroll -->

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>

          { icon: "🌤", text: "Wetter prüfen", prompt: "Wie ist das Wetter in meiner Gegend?" },
          { icon: "✉️", text: "E-Mail schreiben", prompt: "Hilf mir, eine professionelle E-Mail zu schreiben" },
        ]
      }
    };

    let lang = localStorage.getItem("general_lang") || "en";
    if (lang !== "en" && lang !== "de") lang = "en";
    function t(k) { return TR[lang][k] || TR.en[k] || k; }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      const lt = document.getElementById("lang-text"); if (lt) lt.textContent = t("langCode");
      document.documentElement.lang = lang;
      const wt = document.getElementById("welcome-title"); if (wt) wt.textContent = t("welcomeTitle");
      const ws = document.getElementById("welcome-sub"); if (ws) ws.textContent = t("welcomeSub");
      buildSuggestions();
    }

    function buildSuggestions() {
      // Static HTML already built; just wire up click listeners for i18n prompts
      const cards = document.querySelectorAll(".suggestion-card");
      cards.forEach(btn => {
        btn.addEventListener("click", () => {
          const prompt = btn.dataset.prompt;
          if (inputEl && prompt) { inputEl.value = prompt; updateSendBtn(); inputEl.focus(); }
        });
      });
    }

    /* ── Viewport height fix ───────────────────────────────── */
    function setVh() { document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px"); }
    setVh();
    window.addEventListener("resize", setVh);
    window.addEventListener("orientationchange", () => setTimeout(setVh, 120));

    /* ── DOM refs ──────────────────────────────────────────── */
    const sidebar       = document.getElementById("sidebar");
    const sidebarOverlay= document.getElementById("sidebar-overlay");
    const menuBtn       = document.getElementById("menu-btn");
    const closeSidebarBtn = document.getElementById("close-sidebar-btn");
    const pastChatsList = document.getElementById("past-chats-list");
    const sidebarEmpty  = document.getElementById("sidebar-empty");
    const clearChatBtn  = document.getElementById("clear-chat");
    const chatScroll    = document.getElementById("chat-scroll");
    const chatEl        = document.getElementById("chat");
    const welcomeState  = document.getElementById("welcome-state");
    const form          = document.getElementById("form");
    const inputEl       = document.getElementById("input");
    const sendBtn       = document.getElementById("send");
    const fileInput     = document.getElementById("file-input");
    const fileChosenBar = document.getElementById("file-chosen-bar");
    const fileNameEl    = document.getElementById("file-name");
    const fileChosenIcon= document.getElementById("file-chosen-icon");
    const fileClearBtn  = document.getElementById("file-clear-btn");
    // mic-btn and voice-mode-btn removed; voice now via voice-btn → overlay
    const langToggle    = document.getElementById("lang-toggle");

    const PDF_ICON_URL = new URL("images/pdf.png", document.location.href).href;
    const COPY_SVG = `<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="3" width="9" height="12" rx="2"/><rect x="8" y="6" width="9" height="12" rx="2"/></svg>`;
    const EDIT_SVG = `<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 13.5V16h2.5L15 7.5 12.5 5 4 13.5z" stroke-linejoin="round"/><path d="M11 4.5 12.5 3 15 5.5 13.5 7" stroke-linejoin="round"/></svg>`;

    let lastUserEl = null, lastAiEl = null;
    let chosenFile = null, lastPdfAttachment = null;
    let history = [];
    let hasMessages = false;

    /* ── Welcome state ─────────────────────────────────────── */
    function showWelcome(show) {
      if (welcomeState) welcomeState.style.display = show ? "" : "none";
    }
    function updateWelcome() {
      hasMessages = chatEl && chatEl.childElementCount > 0;
      showWelcome(!hasMessages);
    }

    /* ── Sidebar ───────────────────────────────────────────── */
    let sidebarOpen = false;
    function openSidebar() {
      sidebarOpen = true;
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("visible");
      sidebarOverlay.setAttribute("aria-hidden", "false");
      renderHistory();
    }
    function closeSidebar() {
      sidebarOpen = false;
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("visible");
      sidebarOverlay.setAttribute("aria-hidden", "true");
    }
    function toggleSidebar() { sidebarOpen ? closeSidebar() : openSidebar(); }

    if (menuBtn) menuBtn.addEventListener("click", toggleSidebar);
    if (closeSidebarBtn) closeSidebarBtn.addEventListener("click", closeSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener("click", closeSidebar);

    /* ── History render ────────────────────────────────────── */
    function renderHistory() {
      if (!pastChatsList) return;
      pastChatsList.innerHTML = "";
      let archive = [];
      try { const r = localStorage.getItem("general_chat_archive"); if (r) { const a = JSON.parse(r); if (Array.isArray(a)) archive = a; } } catch (_) {}
      const items = archive.slice(-8).reverse();
      if (sidebarEmpty) sidebarEmpty.style.display = items.length ? "none" : "";
      items.forEach(entry => {
        const li = document.createElement("li");
        li.className = "chat-item";
        const first = (entry.history && entry.history[0]) ? String(entry.history[0].content || "").trim().slice(0, 38) : "Chat";
        const dateStr = entry.createdAt ? new Date(entry.createdAt).toLocaleDateString(lang, { month:"short", day:"numeric" }) : "";
        li.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="chat-item-text">${first}</span><span class="chat-item-date">${dateStr}</span>`;
        li.addEventListener("click", () => {
          if (!entry.history || !Array.isArray(entry.history)) return;
          history = entry.history.slice();
          lastPdfAttachment = null;
          try { localStorage.setItem("general_chat_history", JSON.stringify(history)); } catch (_) {}
          chatEl.innerHTML = "";
          history.forEach(m => { if (m && (m.role === "user" || m.role === "assistant")) addMsg(m.role === "user" ? "user" : "ai", m.content || ""); });
          updateWelcome();
          closeSidebar();
        });
        pastChatsList.appendChild(li);
      });
    }
    function scheduleHistory() { setTimeout(() => { try { renderHistory(); } catch (_) {} }, 80); }

    /* ── New chat ──────────────────────────────────────────── */
    if (clearChatBtn) clearChatBtn.addEventListener("click", () => {
      if (history.length > 0) {
        try {
          let arch = [];
          const r = localStorage.getItem("general_chat_archive");
          if (r) { const a = JSON.parse(r); if (Array.isArray(a)) arch = a; }
          arch.push({ history: history.slice(), createdAt: Date.now() });
          arch = arch.slice(-10);
          localStorage.setItem("general_chat_archive", JSON.stringify(arch));
        } catch (_) {}
      }
      history = []; lastUserEl = null; lastAiEl = null; lastPdfAttachment = null;
      try { localStorage.removeItem("general_chat_history"); } catch (_) {}
      chatEl.innerHTML = "";
      updateWelcome();
      scheduleHistory();
      closeSidebar();
    });

    /* ── Language toggle ───────────────────────────────────── */
    if (langToggle) langToggle.addEventListener("click", () => {
      lang = lang === "en" ? "de" : "en";
      localStorage.setItem("general_lang", lang);
      applyI18n();
    });

    /* ── Send button visibility ────────────────────────────── */
    function updateSendBtn() {
      const hasContent = (inputEl && inputEl.value.trim().length > 0) || chosenFile;
      sendBtn.classList.toggle("active", !!hasContent);
      sendBtn.disabled = !hasContent;
    }

    /* ── Input auto-resize ─────────────────────────────────── */
    if (inputEl) {
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
        updateSendBtn();
      });
      inputEl.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const isMobile = window.matchMedia("(max-width: 767px)").matches;
        if (e.ctrlKey || e.metaKey || isMobile) {
          e.preventDefault();
          if (form) form.requestSubmit();
        }
      });
    }

    /* ── File input ────────────────────────────────────────── */
    const MAX_FILE = 3 * 1024 * 1024;
    function toBase64(buf) {
      const u = new Uint8Array(buf); let s = "";
      for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
      return btoa(s);
    }

    function clearFile() {
      chosenFile = null; fileInput.value = "";
      fileNameEl.textContent = ""; fileChosenIcon.innerHTML = "";
      fileChosenBar.classList.remove("visible");
      updateSendBtn();
    }
    if (fileClearBtn) fileClearBtn.addEventListener("click", clearFile);

    fileInput.addEventListener("change", () => {
      chosenFile = fileInput.files?.[0] || null;
      if (!chosenFile) { clearFile(); return; }
      const isPdf = (chosenFile.type || "").toLowerCase() === "application/pdf" || /\.pdf$/i.test(chosenFile.name || "");
      fileChosenIcon.innerHTML = isPdf ? `<img src="${PDF_ICON_URL}" alt="PDF" width="15" height="15">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
      fileNameEl.textContent = chosenFile.name;
      fileChosenBar.classList.add("visible");
      updateSendBtn();
    });

    /* ── Offline fallback ──────────────────────────────────── */
    const KNOWLEDGE = [
      { patterns: ["hi","hello","hey"], responses: ["Hi! How can I help you today? 😊"] },
      { patterns: ["who are you","what are you"], responses: ["I'm General, your AI assistant. What would you like to know?"] },
      { patterns: ["help"], responses: ["Ask me a question about anything you care about."] },
      { patterns: [], responses: ["I couldn't complete that request. Please try again."] }
    ];
    function norm(s) { return s.replace(/[^\w\s]/g, "").toLowerCase().trim(); }
    function tokens(s) { return norm(s).split(/\s+/).filter(Boolean); }
    function thinkFallback(msg) {
      const raw = (msg || "").trim(); if (!raw) return "Ask something.";
      const set = new Set(tokens(raw)); let best = 0, entry = null;
      for (const e of KNOWLEDGE) { if (!e.patterns.length) continue; for (const p of e.patterns) { const score = tokens(p).filter(w => set.has(w)).length / tokens(p).length; if (score > best) { best = score; entry = e; } } }
      if (entry && best >= 0.3) return entry.responses[0];
      return (KNOWLEDGE.find(e => !e.patterns.length) || {}).responses?.[0] || "Your request could not be completed. Try again later.";
    }

    /* ── Markdown formatter ────────────────────────────────── */
    function convertTsv(text) {
      const lines = text.split(/\r?\n/), out = []; let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line && line.includes("\t")) {
          const hcells = line.split("\t").map(c => c.trim()).filter(Boolean);
          if (hcells.length >= 2) {
            const block = [line]; let j = i + 1;
            while (j < lines.length && lines[j] && lines[j].includes("\t")) { block.push(lines[j]); j++; }
            if (block.length >= 2) {
              const rows = block.map(l => l.split("\t").map(c => c.trim()));
              const n = hcells.length;
              out.push("", "| " + hcells.join(" | ") + " |", "| " + hcells.map(() => "---").join(" | ") + " |");
              rows.slice(1).forEach(r => { const cells = []; for (let k = 0; k < n; k++) cells.push(r[k] || ""); out.push("| " + cells.join(" | ") + " |"); });
              out.push(""); i = j; continue;
            }
          }
        }
        out.push(line); i++;
      }
      return out.join("\n");
    }

    function formatUserMsg(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\r\n|\r|\n/g,"<br>");
    }

    function cellHtml(s) {
      return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/_([^_]+)_/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
    }
    function splitRow(l) { return l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()); }
    function isTableRow(l) { const t2=l.trim(); return t2.startsWith("|")&&t2.endsWith("|"); }
    function isSep(l) { return /^\|[\s|:\-]+\|$/.test(l.trim()); }

    function formatMsg(raw) {
      if (!raw) return "";
      raw = convertTsv(String(raw));
      let s = raw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const lines = s.split(/\r?\n/); const out = []; let i = 0;
      while (i < lines.length) {
        const line = lines[i], next = lines[i+1]||"";
        if (isTableRow(line) && isSep(next)) {
          const hcells = splitRow(line); const n = hcells.length;
          let html = '<div class="table-wrap"><table><thead><tr>' + hcells.map(c=>"<th>"+cellHtml(c)+"</th>").join("") + "</tr></thead><tbody>";
          let idx = i + 2;
          while (idx < lines.length && lines[idx].trim() && isTableRow(lines[idx])) {
            const cells = splitRow(lines[idx]); html += "<tr>";
            for (let ci=0;ci<n;ci++) html += "<td>"+cellHtml(ci<cells.length?cells[ci]:"")+  "</td>";
            html += "</tr>"; idx++;
          }
          html += "</tbody></table></div>"; out.push(html); i = idx; continue;
        }
        out.push(line); i++;
      }
      s = out.join("\n");
      s = s.replace(/```\n?([\s\S]*?)```/g, (_m, code) =>
        `<div class="ai-snippet"><div class="ai-snippet-header"><span>Snippet</span><button type="button" class="ai-snippet-copy" aria-label="Copy snippet">${COPY_SVG}</button></div><div class="ai-snippet-body"><pre><code>${code}</code></pre></div></div>`
      );
      s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/_([^_]+)_/g,"<em>$1</em>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,txt,url) => { const u = /^https?:\/\//i.test(url) ? url.replace(/"/g,"&quot;") : "#"; return `<a href="${u}" target="_blank" rel="noopener">${txt}</a>`; });
      s = s.replace(/^####\s+(.+)$/gm,"<span class=\"msg-heading\">$1</span>");
      s = s.replace(/^###\s+(.+)$/gm,"<span class=\"msg-heading\">$1</span>");
      s = s.replace(/^##\s+(.+)$/gm,"<span class=\"msg-heading\">$1</span>");
      s = s.replace(/^#\s+(.+)$/gm,"<span class=\"msg-heading\">$1</span>");
      s = s.replace(/^\s*[-*]\s+(.+)$/gm,"<li>$1</li>");
      s = s.replace(/^\s*\d+\.\s+(.+)$/gm,"<li>$1</li>");
      s = s.replace(/((?:<li>[\s\S]*?<\/li>\n?)+)/g,"<ul>$1</ul>");
      const blocks = s.split(/\n{2,}/);
      return blocks.map(b => {
        const trimmed = b.trim(); if (!trimmed) return "";
        if (/^<\/?(?:ul|ol|li|table|thead|tbody|tr|th|td|div|pre|code|h[1-6]|blockquote)\b/i.test(trimmed) || trimmed.startsWith('<div class="table-wrap') || trimmed.startsWith('<div class="ai-snippet')) return trimmed;
        if (/^<p\b/i.test(trimmed)) return trimmed;
        return "<p>"+trimmed+"</p>";
      }).filter(Boolean).join("\n\n");
    }

    function copyToClipboard(text) {
      if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).catch(()=>{}); return; }
      try { const ta = document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); } catch(_){}
    }

    /* ── Add message ───────────────────────────────────────── */
    function addMsg(role, text, opts) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      // Bubble
      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";

      // Name label
      const name = document.createElement("div");
      name.className = "msg-name";
      name.textContent = role === "user" ? t("you") : t("general");
      bubble.appendChild(name);

      // Content
      const contentEl = document.createElement("div");
      contentEl.className = "msg-content";
      contentEl.innerHTML = role === "user" ? formatUserMsg(text) : formatMsg(text);
      bubble.appendChild(contentEl);

      // Attachment badge (user)
      if (role === "user" && opts?.attachment?.name) {
        const badge = document.createElement("div");
        badge.className = "attach-badge";
        const isPdf = (opts.attachment.type || "").toLowerCase() === "pdf";
        const shortName = opts.attachment.name.length > 28 ? opts.attachment.name.slice(0,25)+"…" : opts.attachment.name;
        badge.innerHTML = (isPdf ? `<img src="${PDF_ICON_URL}" alt="PDF">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`) + `<span>${shortName}</span>`;
        bubble.appendChild(badge);
      }

      // Actions
      const actions = document.createElement("div");
      actions.className = "msg-actions";

      const copyBtn = document.createElement("button");
      copyBtn.type = "button"; copyBtn.className = "action-btn"; copyBtn.setAttribute("aria-label","Copy message");
      copyBtn.innerHTML = COPY_SVG;
      copyBtn.addEventListener("click", () => {
        copyToClipboard(contentEl.innerText || "");
        copyBtn.innerHTML = "✓"; copyBtn.classList.add("copied");
        setTimeout(() => { copyBtn.innerHTML = COPY_SVG; copyBtn.classList.remove("copied"); }, 2000);
      });
      actions.appendChild(copyBtn);

      if (role === "user") {
        const editBtn = document.createElement("button");
        editBtn.type = "button"; editBtn.className = "action-btn edit-btn"; editBtn.setAttribute("aria-label","Edit message");
        editBtn.innerHTML = EDIT_SVG;
        editBtn.addEventListener("click", () => {
          const textContent = contentEl.innerText || ""; if (!textContent) return;
          if (inputEl) { inputEl.value = textContent; inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,200)+"px"; inputEl.focus(); updateSendBtn(); }
          if (lastAiEl?.parentNode) lastAiEl.parentNode.removeChild(lastAiEl);
          if (lastUserEl?.parentNode) lastUserEl.parentNode.removeChild(lastUserEl);
          if (Array.isArray(history) && history.length >= 2) { history.splice(-2,2); try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch(_){} }
          lastUserEl = null; lastAiEl = null;
          updateWelcome();
        });
        actions.appendChild(editBtn);
        if (lastUserEl) { const oldEdit = lastUserEl.querySelector(".edit-btn"); if (oldEdit?.parentNode) oldEdit.parentNode.removeChild(oldEdit); }
        lastUserEl = row;
      } else {
        lastAiEl = row;
      }
      bubble.appendChild(actions);
      row.appendChild(bubble);

      // Snippet copy wiring (AI only)
      if (role === "ai") {
        row.querySelectorAll(".ai-snippet").forEach(snip => {
          const btn = snip.querySelector(".ai-snippet-copy");
          const body = snip.querySelector(".ai-snippet-body");
          if (!btn || !body) return;
          btn.addEventListener("click", () => {
            copyToClipboard(body.innerText || "");
            btn.innerHTML = "✓"; btn.classList.add("copied");
            setTimeout(() => { btn.innerHTML = COPY_SVG; btn.classList.remove("copied"); }, 2000);
          });
        });
      }

      chatEl.appendChild(row);
      requestAnimationFrame(() => row.scrollIntoView({ behavior: "smooth", block: "end" }));
      updateWelcome();
      return row;
    }

    /* ── Typing indicator ──────────────────────────────────── */
    function addTyping() {
      const row = document.createElement("div");
      row.className = "msg-row ai typing-row";
      const avatar = document.createElement("div");
      avatar.className = "msg-avatar ai-avatar";
      avatar.innerHTML = `<img src="/images/g.png" alt="" onerror="this.parentElement.textContent='G'">`;
      row.appendChild(avatar);
      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      const name = document.createElement("div");
      name.className = "msg-name"; name.textContent = t("general");
      bubble.appendChild(name);
      const dots = document.createElement("div");
      dots.className = "msg-content";
      dots.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
      bubble.appendChild(dots);
      row.appendChild(bubble);
      chatEl.appendChild(row);
      requestAnimationFrame(() => row.scrollIntoView({ behavior: "smooth", block: "end" }));
      return row;
    }

    /* ── Form submit ───────────────────────────────────────── */
    if (form) form.addEventListener("submit", async e => {
      e.preventDefault();
      const raw = inputEl ? inputEl.value.trim() : "";
      const file = chosenFile;
      if (!raw && !file) { if (inputEl) inputEl.focus(); return; }

      const displayMsg = raw || (file ? "[" + file.name + "]" : (lastPdfAttachment ? "[" + lastPdfAttachment.name + "]" : ""));
      const attachOpts = file
        ? { attachment: { type: ((file.type||"").toLowerCase()==="application/pdf"||/\.pdf$/i.test(file.name||"")) ? "pdf" : "image", name: file.name } }
        : (lastPdfAttachment ? { attachment: { type: "pdf", name: lastPdfAttachment.name } } : undefined);

      if (file && file.size > MAX_FILE) {
        addMsg("user", displayMsg, attachOpts);
        addMsg("ai", "File too large. Use a PDF under 3 MB so it fits within the server limit.");
        clearFile(); return;
      }

      addMsg("user", displayMsg, attachOpts);
      if (inputEl) { inputEl.value = ""; inputEl.style.height = "auto"; }
      if (file) clearFile();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      sendBtn.disabled = true; sendBtn.classList.remove("active");
      const typingEl = addTyping();

      try {
        const body = { message: raw || (file ? (lang==="de"?"Was ist in dieser Datei?":"What is in this file?") : "") };
        if (file) {
          const buf = await file.arrayBuffer();
          const isPdf = (file.type||"").toLowerCase()==="application/pdf"||/\.pdf$/i.test(file.name||"");
          if (isPdf) { body.pdf = toBase64(buf); lastPdfAttachment = { base64: body.pdf, name: file.name }; }
          else { body.image = toBase64(buf); lastPdfAttachment = null; }
        } else if (lastPdfAttachment) {
          body.pdf = lastPdfAttachment.base64;
        }
        body.history = history.slice(-20);

        const apiRes = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body), signal: AbortSignal.timeout(90000) });
        const ct = apiRes.headers.get("Content-Type") || "";

        if (ct.includes("text/event-stream")) {
          if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);

          // Streaming shell
          const row = document.createElement("div"); row.className = "msg-row ai";
          const av = document.createElement("div"); av.className = "msg-avatar ai-avatar";
          av.innerHTML = `<img src="/images/g.png" alt="" onerror="this.parentElement.textContent='G'">`;
          row.appendChild(av);
          const bbl = document.createElement("div"); bbl.className = "msg-bubble";
          const nm = document.createElement("div"); nm.className = "msg-name"; nm.textContent = t("general");
          bbl.appendChild(nm);
          const cEl = document.createElement("div"); cEl.className = "msg-content streaming";
          bbl.appendChild(cEl);
          row.appendChild(bbl);
          chatEl.appendChild(row);
          lastAiEl = row;
          row.scrollIntoView({ behavior: "smooth", block: "end" });
          updateWelcome();

          let full = "", finished = false;
          const reader = apiRes.body.getReader();
          const dec = new TextDecoder(); let buf = "";
          try {
            outer: while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              const ll = buf.split("\n"); buf = ll.pop();
              for (const line of ll) {
                if (!line.startsWith("data: ")) continue;
                try {
                  const obj = JSON.parse(line.slice(6).trim());
                    if (obj.t) { full += obj.t; cEl.innerHTML = formatMsg(full); row.scrollIntoView({ behavior: "auto", block: "end" }); }
                  if (obj.done || obj.err) {
                    finished = true;
                    const replyText = obj.err ? (full||obj.err) : full;
                    cEl.classList.remove("streaming");
                    cEl.innerHTML = formatMsg(replyText);
                    row.querySelectorAll(".ai-snippet").forEach(snip => {
                      const sb = snip.querySelector(".ai-snippet-copy");
                      const sbody = snip.querySelector(".ai-snippet-body");
                      if (!sb||!sbody) return;
                      sb.addEventListener("click", () => { copyToClipboard(sbody.innerText||""); sb.innerHTML="✓"; sb.classList.add("copied"); setTimeout(()=>{sb.innerHTML=COPY_SVG;sb.classList.remove("copied");},2000); });
                    });
                    const acts = document.createElement("div"); acts.className = "msg-actions";
                    const cpb = document.createElement("button"); cpb.type="button"; cpb.className="action-btn"; cpb.setAttribute("aria-label","Copy message"); cpb.innerHTML = COPY_SVG;
                    cpb.addEventListener("click", () => { copyToClipboard(cEl.innerText||""); cpb.innerHTML="✓"; cpb.classList.add("copied"); setTimeout(()=>{cpb.innerHTML=COPY_SVG;cpb.classList.remove("copied");},2000); });
                    acts.appendChild(cpb); bbl.appendChild(acts);
                    history.push({ role:"user", content: body.message });
                    history.push({ role:"assistant", content: replyText });
                    try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch(_){}
                    scheduleHistory(); speakReply(replyText);
                    break outer;
                  }
                } catch(_) {}
              }
            }
          } catch (streamErr) {
            cEl.classList.remove("streaming");
            if (!full) cEl.innerHTML = formatMsg("Your request could not be completed. Try again later.");
            else cEl.innerHTML = formatMsg(full);
          }
          if (!finished && !full) { cEl.classList.remove("streaming"); cEl.innerHTML = formatMsg("Your request could not be completed. Try again later."); }

        } else {
          let data;
          try { data = await apiRes.json(); } catch(_) { data = { reply: apiRes?.status===413 ? "File too large. Try a smaller PDF (under 3 MB)." : "Your request could not be completed. Try again later." }; }
          const reply = (data?.reply) ? data.reply : (data?.error) ? data.error : (!apiRes?.ok) ? (apiRes?.status===413?"File too large. Try a smaller PDF (under 3 MB).":"Your request could not be completed. Try again later.") : "No reply.";
          if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);
          history.push({ role:"user", content: body.message });
          history.push({ role:"assistant", content: reply });
          addMsg("ai", reply);
          try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch(_){}
          scheduleHistory(); speakReply(reply);
        }

      } catch(err) {
        const errMsg = err?.name==="AbortError"
          ? "Your request took too long. Please check your connection and try again."
          : (file ? "Your request with the file could not be completed. Try a smaller PDF (under 3 MB)." : thinkFallback(displayMsg));
        if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);
        addMsg("ai", errMsg);
      } finally {
        sendBtn.disabled = false;
        updateSendBtn();
        setTimeout(() => { if (inputEl) inputEl.focus(); }, 120);
      }
    });

    /* ══ Voice system ══════════════════════════════════════════════════
       Three modes:
       1. Idle   – overlay closed, voice-btn in form bar opens it
       2. Voice  – overlay open, full STT→API→TTS loop
       3. STT-only (mic-btn in form) – transcript goes to text input
    ══════════════════════════════════════════════════════════════════ */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Show/hide voice buttons based on SR availability
    const voiceBtnEl = document.getElementById("voice-btn");
    const welcomeVoiceBtn = document.getElementById("welcome-voice-btn");
    if (!SR) {
      document.body.classList.add("no-speech");
      if (voiceBtnEl) voiceBtnEl.style.display = "none";
    } else {
      if (voiceBtnEl) voiceBtnEl.style.display = "";
      if (welcomeVoiceBtn) welcomeVoiceBtn.classList.add("sr-ready");
    }
    if (welcomeVoiceBtn) welcomeVoiceBtn.addEventListener("click", () => openVoiceOverlay());

    // Overlay refs
    const voiceOverlay  = document.getElementById("voice-overlay");
    const voOrbEl       = document.getElementById("vo-orb");
    const voStateEl     = document.getElementById("vo-state");
    const voTransEl     = document.getElementById("vo-transcript");
    const voMicBtnEl    = document.getElementById("vo-mic-btn");
    const voStopBtnEl   = document.getElementById("vo-stop-btn");
    const voCanvas      = document.getElementById("vo-canvas");

    let voiceActive = false;   // overlay open?
    let voListening = false;   // STT running?
    let voSpeaking  = false;   // TTS running?
    let voThinking  = false;   // API call in progress?
    let voRec       = null;    // SpeechRecognition instance
    let voAudioCtx  = null;
    let voAnalyser  = null;
    let voMicStream = null;
    let voAnimFrame = null;

    /* ── Canvas waveform ─────────────────────────────────── */
    function startWaveform(stream) {
      try {
        voAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        voAnalyser = voAudioCtx.createAnalyser();
        voAnalyser.fftSize = 64;
        const src = voAudioCtx.createMediaStreamSource(stream);
        src.connect(voAnalyser);
        drawWaveform();
      } catch(_) {}
    }
    function stopWaveform() {
      if (voAnimFrame) { cancelAnimationFrame(voAnimFrame); voAnimFrame = null; }
      try { if (voAudioCtx) { voAudioCtx.close(); voAudioCtx = null; voAnalyser = null; } } catch(_) {}
      if (voCanvas) { const ctx = voCanvas.getContext("2d"); ctx.clearRect(0,0,voCanvas.width,voCanvas.height); }
    }
    function drawWaveform() {
      if (!voAnalyser || !voCanvas) return;
      const ctx = voCanvas.getContext("2d");
      const W = voCanvas.width, H = voCanvas.height;
      const data = new Uint8Array(voAnalyser.frequencyBinCount);
      voAnalyser.getByteFrequencyData(data);

      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2;
      const baseR = 58;
      const bars = Math.min(data.length, 32);
      const angleStep = (Math.PI * 2) / bars;

      for (let i = 0; i < bars; i++) {
        const amp = (data[i] || 0) / 255;
        const len = 12 + amp * 30;
        const angle = i * angleStep - Math.PI / 2;
        const x1 = cx + Math.cos(angle) * baseR;
        const y1 = cy + Math.sin(angle) * baseR;
        const x2 = cx + Math.cos(angle) * (baseR + len);
        const y2 = cy + Math.sin(angle) * (baseR + len);
        const alpha = 0.35 + amp * 0.65;
        ctx.strokeStyle = voSpeaking
          ? `rgba(52,211,153,${alpha})`
          : `rgba(96,165,250,${alpha})`;
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      voAnimFrame = requestAnimationFrame(drawWaveform);
    }

    /* ── Orb state ───────────────────────────────────────── */
    function setOrbState(state) {
      // state: 'idle' | 'listening' | 'thinking' | 'speaking'
      if (!voOrbEl) return;
      voOrbEl.classList.remove("listening","thinking","speaking");
      if (state !== "idle") voOrbEl.classList.add(state);
      const labels = {
        idle:      lang === "de" ? "Mikrofon antippen" : "Tap mic to speak",
        listening: lang === "de" ? "Zuhören…" : "Listening…",
        thinking:  lang === "de" ? "Denke nach…" : "Thinking…",
        speaking:  lang === "de" ? "Spricht…" : "Speaking…",
      };
      if (voStateEl) voStateEl.textContent = labels[state] || "";
    }

    /* ── Open / close overlay ────────────────────────────── */
    function openVoiceOverlay() {
      if (!SR) return;
      voiceActive = true;
      if (voiceOverlay) { voiceOverlay.style.display = ""; voiceOverlay.classList.add("show"); }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      setOrbState("idle");
      setVoTranscript("", "");
      // Auto-start listening immediately
      setTimeout(voStartListening, 350);
    }
    function closeVoiceOverlay() {
      voiceActive = false;
      voListening = false; voSpeaking = false; voThinking = false;
      if (voRec) { try { voRec.stop(); } catch(_){} voRec = null; }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      stopWaveform();
      if (voMicStream) { voMicStream.getTracks().forEach(t => t.stop()); voMicStream = null; }
      if (voiceOverlay) { voiceOverlay.classList.remove("show"); setTimeout(() => { if (!voiceActive) voiceOverlay.style.display = "none"; }, 300); }
      if (voMicBtnEl) voMicBtnEl.classList.remove("active");
      setOrbState("idle");
    }

    if (voiceBtnEl) voiceBtnEl.addEventListener("click", () => openVoiceOverlay());
    if (voStopBtnEl) voStopBtnEl.addEventListener("click", () => closeVoiceOverlay());
    // Close on backdrop click
    if (voiceOverlay) voiceOverlay.addEventListener("click", e => { if (e.target === voiceOverlay || e.target.classList.contains("vo-bg")) closeVoiceOverlay(); });
    // Close on Escape
    document.addEventListener("keydown", e => { if (e.key === "Escape" && voiceActive) closeVoiceOverlay(); });

    // Tap mic button inside overlay
    if (voMicBtnEl) voMicBtnEl.addEventListener("click", () => {
      if (voListening) { if (voRec) { try { voRec.stop(); } catch(_){} } }
      else if (!voThinking && !voSpeaking) { voStartListening(); }
    });

    /* ── Transcript display ──────────────────────────────── */
    function setVoTranscript(final, interim) {
      if (!voTransEl) return;
      voTransEl.innerHTML =
        (final ? `<span class="vo-final">${escHtml(final)}</span>` : "") +
        (interim ? `<span class="vo-interim"> ${escHtml(interim)}</span>` : "");
    }
    function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    /* ── STT in voice overlay ────────────────────────────── */
    async function voStartListening() {
      if (!SR || !voiceActive || voListening || voThinking || voSpeaking) return;
      // Request mic for waveform (separate from STT)
      try {
        voMicStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startWaveform(voMicStream);
      } catch(_) {}

      voRec = new SR();
      voRec.continuous = false;
      voRec.interimResults = true;
      voRec.lang = lang === "de" ? "de-DE" : "en-US";

      let finalText = "";

      voRec.onstart = () => {
        voListening = true;
        setOrbState("listening");
        if (voMicBtnEl) voMicBtnEl.classList.add("active");
        setVoTranscript("", "");
      };

      voRec.onresult = e => {
        let interim = "", final = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        if (final) finalText += final;
        setVoTranscript(finalText, interim);
      };

      voRec.onerror = e => {
        console.warn("STT error:", e.error);
        voListening = false;
        if (voMicBtnEl) voMicBtnEl.classList.remove("active");
        stopWaveform();
        if (voMicStream) { voMicStream.getTracks().forEach(t => t.stop()); voMicStream = null; }
        if (voiceActive && e.error !== "aborted") setOrbState("idle");
      };

      voRec.onend = () => {
        voListening = false;
        if (voMicBtnEl) voMicBtnEl.classList.remove("active");
        stopWaveform();
        if (voMicStream) { voMicStream.getTracks().forEach(t => t.stop()); voMicStream = null; }
        if (!voiceActive) return;
        const said = finalText.trim();
        if (said) {
          setVoTranscript(said, "");
          voSendMessage(said);
        } else {
          setOrbState("idle");
        }
      };

      try { voRec.start(); } catch(e) { voListening = false; setOrbState("idle"); }
    }

    /* ── Send to API from voice mode ─────────────────────── */
    async function voSendMessage(text) {
      if (!voiceActive) return;
      voThinking = true;
      setOrbState("thinking");
      // Also log to the chat UI
      addMsg("user", text);

      const typingEl = addTyping();
      let replyText = "";

      try {
        const body = { message: text, history: history.slice(-20) };
        if (lastPdfAttachment) body.pdf = lastPdfAttachment.base64;

        const apiRes = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: AbortSignal.timeout(90000)
        });
        const ct = apiRes.headers.get("Content-Type") || "";

        if (ct.includes("text/event-stream")) {
          if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);
          // Build streaming shell in chat
          const row = document.createElement("div"); row.className = "msg-row ai";
          const av = document.createElement("div"); av.className = "msg-avatar ai-avatar";
          av.innerHTML = `<img src="/images/g.png" alt="" onerror="this.parentElement.textContent='G'">`;
          row.appendChild(av);
          const bbl = document.createElement("div"); bbl.className = "msg-bubble";
          const nm = document.createElement("div"); nm.className = "msg-name"; nm.textContent = t("general");
          bbl.appendChild(nm);
          const cEl = document.createElement("div"); cEl.className = "msg-content streaming";
          bbl.appendChild(cEl); row.appendChild(bbl); chatEl.appendChild(row);
          lastAiEl = row; row.scrollIntoView({ behavior:"smooth", block:"end" }); updateWelcome();

          let full = "";
          const reader = apiRes.body.getReader(); const dec = new TextDecoder(); let buf = "";
          try {
            outer2: while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              const ll = buf.split("\n"); buf = ll.pop();
              for (const line of ll) {
                if (!line.startsWith("data: ")) continue;
                try {
                  const obj = JSON.parse(line.slice(6).trim());
                  if (obj.t) { full += obj.t; cEl.innerHTML = formatMsg(full); row.scrollIntoView({behavior:"auto",block:"end"}); }
                  if (obj.done || obj.err) {
                    replyText = obj.err ? (full||obj.err) : full;
                    cEl.classList.remove("streaming"); cEl.innerHTML = formatMsg(replyText);
                    const acts = document.createElement("div"); acts.className="msg-actions";
          const cpb = document.createElement("button"); cpb.type="button"; cpb.className="action-btn"; cpb.setAttribute("aria-label","Copy message"); cpb.innerHTML=COPY_SVG;
                    cpb.addEventListener("click", () => { copyToClipboard(cEl.innerText||""); cpb.innerHTML="✓"; cpb.classList.add("copied"); setTimeout(()=>{cpb.innerHTML=COPY_SVG;cpb.classList.remove("copied");},2000); });
                    acts.appendChild(cpb); bbl.appendChild(acts);
                    break outer2;
                  }
                } catch(_) {}
              }
            }
          } catch(_) { if (!full) replyText="Your request could not be completed."; else replyText=full; cEl.classList.remove("streaming"); cEl.innerHTML=formatMsg(replyText); }
          if (!replyText) { cEl.classList.remove("streaming"); cEl.innerHTML=formatMsg("Your request could not be completed."); replyText="Your request could not be completed."; }
        } else {
          let data; try { data = await apiRes.json(); } catch(_) { data={}; }
          replyText = data?.reply || data?.error || "Your request could not be completed.";
          if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);
          addMsg("ai", replyText);
        }

        history.push({ role:"user", content: text });
        history.push({ role:"assistant", content: replyText });
        try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch(_) {}
        scheduleHistory();

      } catch(err) {
        replyText = err?.name==="AbortError" ? "Request timed out. Try again." : "Your request could not be completed.";
        if (typingEl?.parentNode) typingEl.parentNode.removeChild(typingEl);
        addMsg("ai", replyText);
      }

      voThinking = false;

      // Speak the reply, then listen again
      if (voiceActive && replyText) {
        voSpeakReply(replyText);
      } else if (voiceActive) {
        setOrbState("idle");
      }
    }

    /* ── TTS in voice overlay ────────────────────────────── */
    function voSpeakReply(text) {
      if (!voiceActive || !window.speechSynthesis) { if (voiceActive) setTimeout(voStartListening, 500); return; }
      window.speechSynthesis.cancel();
      const plain = text
        .replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1")
        .replace(/#+\s/g,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1")
        .replace(/[-*]\s/g,"").replace(/<[^>]*>/g,"").slice(0,600); // keep replies short for quicker speech
      const utt = new SpeechSynthesisUtterance(plain);
      utt.lang = lang === "de" ? "de-DE" : "en-US";
      utt.rate = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const pref = voices.find(v => /natural|neural|samantha|google/i.test(v.name) && v.lang.startsWith(utt.lang.slice(0,2))) || voices.find(v => v.lang.startsWith(utt.lang.slice(0,2)));
      if (pref) utt.voice = pref;

      voSpeaking = true;
      setOrbState("speaking");
      // Show what General is saying
      setVoTranscript(plain.slice(0, 120) + (plain.length > 120 ? "…" : ""), "");

      // Try to get mic stream just for the speaking waveform visualisation
      if (window.AudioContext || window.webkitAudioContext) {
        try {
          navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
            voMicStream = stream;
            startWaveform(stream);
          }).catch(() => {});
        } catch(_) {}
      }

      utt.onend = () => {
        voSpeaking = false;
        stopWaveform();
        if (voMicStream) { voMicStream.getTracks().forEach(t => t.stop()); voMicStream = null; }
        if (voiceActive) setTimeout(voStartListening, 500);
      };
      utt.onerror = () => {
        voSpeaking = false;
        stopWaveform();
        if (voMicStream) { voMicStream.getTracks().forEach(t => t.stop()); voMicStream = null; }
        if (voiceActive) setTimeout(voStartListening, 500);
      };
      window.speechSynthesis.speak(utt);
    }

    /* ── speakReply for text-chat mode (no voice overlay) ── */
    function speakReply(text) {
      // Only speaks if voice overlay is active
      // Text chat doesn't auto-speak
      return;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    /* ── Restore session ───────────────────────────────────── */
    try {
      const raw = localStorage.getItem("general_chat_history");
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length > 0) {
          history = arr;
          arr.forEach(m => { if (m && (m.role==="user"||m.role==="assistant")) addMsg(m.role==="user"?"user":"ai", m.content||""); });
          const msgs = chatEl.querySelectorAll(".msg-row");
          for (let i=msgs.length-1;i>=0;i--) { if (msgs[i].classList.contains("user")) { lastUserEl=msgs[i]; break; } }
          for (let i=msgs.length-1;i>=0;i--) { if (msgs[i].classList.contains("ai")) { lastAiEl=msgs[i]; break; } }
        }
      }
    } catch(_){}

    updateWelcome();
    scheduleHistory();
    applyI18n();
    if (inputEl) { inputEl.focus(); updateSendBtn(); }

  })();
  </script>
