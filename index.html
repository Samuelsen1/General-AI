<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="General – AI assistant with Wikipedia, web search, weather, definitions, news, and LLM. Chat and attach PDFs or images." />
  <title>General</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Base tokens — Blue & White ─────────────────────── */
    :root {
      --bg: #ffffff;
      --surface: #e9f0ff;
      --surface-hover: #d7e3ff;
      --border: rgba(37,99,235,0.16);
      --border-solid: #93c5fd;
      --text: #0b1120;
      --text-soft: #111827;
      --text-dim: #4b5563;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: rgba(37,99,235,0.16);
      --accent-soft2: rgba(37,99,235,0.08);
      --user-bg: #dbeafe;
      --user-border: #93c5fd;
      --radius: 12px;
      --radius-lg: 18px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
      --sidebar-w: 268px;
      --transition: 0.18s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --surface: #020617;
        --surface-hover: #0b1120;
        --border: rgba(148,163,184,0.35);
        --border-solid: #1f2937;
        --text: #e5e7eb;
        --text-soft: #e5e7eb;
        --text-dim: #9ca3af;
        --accent: #60a5fa;
        --accent-hover: #3b82f6;
        --accent-soft: rgba(96,165,250,0.25);
        --accent-soft2: rgba(96,165,250,0.12);
        --user-bg: #1e3a5f;
        --user-border: #60a5fa;
      }
      .history-rail .icon-btn {
        background: #020617;
        border: 1px solid var(--border-solid);
        color: var(--text-soft);
      }
    }

    /* ─── Reset & base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ─── Layout shell ────────────────────────────────────── */
    .shell {
      display: flex; height: 100vh; height: 100dvh;
      overflow: hidden;
      position: relative;
    }
    @supports not (height: 100dvh) {
      .shell { height: calc(var(--vh, 1vh) * 100); }
    }

    .history-rail {
      width: 56px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.9rem;
      background: var(--surface);
      border-right: 1px solid var(--border-solid);
      z-index: 11;
    }

    /* ─── Sidebar — always a hidden drawer ───────────────── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w); max-width: 85vw;
      display: flex; flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border-solid);
      box-shadow: 4px 0 32px rgba(37,99,235,0.08), 2px 0 12px rgba(0,0,0,0.06);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      z-index: 50;
      will-change: transform;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border-solid);
      gap: 0.5rem;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text);
    }
    .sidebar-brand img {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; min-width: 36px;
      background: none; border: none; border-radius: var(--radius);
      color: var(--text-dim); cursor: pointer;
      transition: background var(--transition), color var(--transition);
      touch-action: manipulation;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--accent); }
    .icon-btn svg { width: 17px; height: 17px; }

    .sidebar-body {
      flex: 1; min-height: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0.6rem 0.6rem;
    }
    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 99px; }

    .sidebar-section-title {
      font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text-dim);
      padding: 0.5rem 0.6rem 0.3rem;
    }
    .chat-item {
      display: flex; align-items: center;
      padding: 0.55rem 0.7rem; border-radius: var(--radius);
      cursor: pointer; font-size: 0.84rem; color: var(--text-soft);
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
      gap: 0.5rem;
    }
    .chat-item:hover { background: var(--surface-hover); color: var(--accent); }
    .chat-item svg { flex-shrink: 0; width: 14px; height: 14px; opacity: 0.4; }
    .chat-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item-date { font-size: 0.7rem; color: var(--text-dim); flex-shrink: 0; }
    .sidebar-empty { padding: 0.75rem 0.7rem; font-size: 0.82rem; color: var(--text-dim); }

    .sidebar-footer {
      flex-shrink: 0; padding: 0.65rem 0.65rem;
      border-top: 1px solid var(--border-solid);
    }
    .sidebar-legal {
      margin-top: 0.5rem;
    }
    .sidebar-legal summary {
      list-style: none; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: var(--text-dim);
      padding: 0.4rem 0.5rem; border-radius: var(--radius); display: flex; align-items: center; gap: 0.35rem;
      transition: background var(--transition), color var(--transition);
    }
    .sidebar-legal summary::-webkit-details-marker { display: none; }
    .sidebar-legal summary:hover { background: var(--surface-hover); color: var(--accent); }
    .sidebar-legal summary svg { width: 14px; height: 14px; opacity: 0.8; }
    .sidebar-legal-nav {
      display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; padding: 0.5rem 0.5rem 0 0;
      font-size: 0.72rem;
    }
    .sidebar-legal-nav a { color: var(--text-dim); text-decoration: none; font-weight: 500; }
    .sidebar-legal-nav a:hover { color: var(--accent); }
    .sidebar-legal-nav .sep { color: var(--text-dim); opacity: 0.6; user-select: none; }
    .new-chat-btn {
      width: 100%; display: flex; align-items: center; gap: 0.55rem;
      padding: 0.65rem 0.9rem; min-height: 42px;
      background: var(--accent); border: none; border-radius: var(--radius);
      font: inherit; font-size: 0.87rem; font-weight: 600; color: #fff;
      cursor: pointer; transition: all var(--transition); touch-action: manipulation;
    }
    .new-chat-btn:hover { background: var(--accent-hover); }
    .new-chat-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ─── Sidebar overlay ─────────────────────────────────── */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.4); z-index: 40;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .sidebar-overlay.visible { display: block; }

    /* ─── Main area ───────────────────────────────────────── */
    .main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    /* ─── Top bar ─────────────────────────────────────────── */
    .topbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.1rem;
      background: var(--bg);
      position: relative; z-index: 10;
    }
    .topbar-title {
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); letter-spacing: -0.025em;
      display: flex; align-items: center; gap: 0.45rem;
    }
    .topbar-title .logo-img {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .topbar-spacer { flex: 1; }
    .lang-toggle {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.32rem 0.7rem; font: inherit;
      font-size: 0.77rem; font-weight: 600; color: var(--text-dim);
      background: none; border: 1px solid var(--border-solid); border-radius: 99px;
      cursor: pointer; transition: all var(--transition);
    }
    .lang-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .lang-toggle svg { width: 13px; height: 13px; }

    /* ─── Chat scroll area ────────────────────────────────── */
    .chat-scroll {
      flex: 1; min-height: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      background: none;
    }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 99px; }

    /* ─── Welcome state ───────────────────────────────────── */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%;
      padding: 2.5rem 1.5rem 1rem;
      text-align: center;
      animation: fade-in 0.4s ease both;
    }
    .welcome-icon-wrap {
      width: 140px; height: 140px;
      background: linear-gradient(135deg, var(--accent) 0%, #60a5fa 100%);
      border-radius: 32px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(37,99,235,0.3), 0 0 40px rgba(37,99,235,0.15);
      animation: logo-float 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .welcome-icon-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .welcome-icon-wrap img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
      border-radius: 50%;
      background: none;
      border: none;
      box-shadow: none;
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .welcome-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      margin: 0 0 0.8rem;
    }

    .welcome-sub {
      font-size: 0.93rem;
      color: var(--text-dim);
      margin: 0 0 2rem;
      max-width: 420px;
      line-height: 1.55;
      min-height: auto;
      animation: greeting-fade 0.5s ease both;
    }

    @keyframes greeting-fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .greeting-emoji {
      font-size: 1.2em;
      display: inline-block;
      margin-right: 0.35rem;
      animation: emoji-bounce 1s ease-in-out;
    }

    @keyframes emoji-bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      max-width: 540px; width: 100%;
    }
    @media (max-width: 480px) {
      .suggestions { grid-template-columns: repeat(2, 1fr); max-width: 340px; }
    }
    .suggestion-card {
      background: var(--bg);
      border: 1.5px solid var(--border-solid);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      text-align: left; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      font-size: 0.85rem; color: var(--text-soft);
      line-height: 1.45;
      display: flex; flex-direction: column; gap: 0.5rem;
      box-shadow: 0 1px 4px rgba(37,99,235,0.04);
    }
    .suggestion-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.12);
    }
    .suggestion-card:active { transform: translateY(0); }
    .s-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .s-icon-wrap svg { width: 18px; height: 18px; }
    .s-icon-wrap.news    { background: #eff6ff; color: #2563eb; }
    .s-icon-wrap.robot   { background: #f0fdf4; color: #16a34a; }
    .s-icon-wrap.weather { background: #fefce8; color: #ca8a04; }
    .s-icon-wrap.email   { background: #fdf4ff; color: #9333ea; }
    @media (prefers-color-scheme: dark) {
      .s-icon-wrap.news    { background: rgba(37,99,235,0.2);  color: #93c5fd; }
      .s-icon-wrap.robot   { background: rgba(22,163,74,0.2);  color: #86efac; }
      .s-icon-wrap.weather { background: rgba(202,138,4,0.2);  color: #fde047; }
      .s-icon-wrap.email   { background: rgba(147,51,234,0.2); color: #d8b4fe; }
    }
    .s-text { font-weight: 600; font-size: 0.84rem; color: var(--text); }
    .s-sub  { font-size: 0.76rem; color: var(--text-dim); font-weight: 400; }

    /* Voice CTA on welcome screen */
    .voice-cta {
      display: none; /* shown only when SR available */
      align-items: center; gap: 0.6rem;
      padding: 0.7rem 1.4rem;
      background: var(--surface);
      color: var(--text-soft);
      border: 1px solid var(--border-solid);
      border-radius: 999px;
      font: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
      margin-top: 1.4rem;
      margin-bottom: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .voice-cta:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(15,23,42,0.08);
    }
    .voice-cta:active { transform: translateY(0); }
    .voice-cta svg { width: 18px; height: 18px; }
    .voice-cta.sr-ready { display: flex; }

    /* ─── Messages ─────────────────────────────────────────── */
    .chat-inner {
      max-width: 720px; margin: 0 auto;
      padding: 1.5rem 1.25rem 0.5rem;
      width: 100%;
    }
    @media (max-width: 767px) {
      .chat-inner { padding: 1rem 0.75rem 0.25rem; }
    }

    .msg-row {
      display: flex; gap: 0.75rem;
      padding: 0.6rem 0;
      animation: msg-in 0.22s ease both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; min-width: 30px;
      border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar.ai-avatar {
      background: #ffffff;
      border: 1px solid var(--border-solid);
      box-shadow: 0 4px 14px rgba(15,23,42,0.12);
      color: var(--accent);
    }
    .msg-avatar.ai-avatar img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .msg-avatar.user-avatar {
      display: none;
    }
    .msg-row.ai .msg-avatar {
      display: none !important;
    }

    .msg-bubble {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
    }
    .msg-row.user .msg-bubble { align-items: flex-end; }

    .msg-name {
      display: none;
    }

    .msg-content {
      display: inline-block;
      font-size: 0.97rem; line-height: 1.7;
      color: var(--text-soft);
      max-width: 100%;
    }
    .msg-row.user .msg-content {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-radius: 18px 18px 4px 18px;
      padding: 0.65rem 1rem;
      white-space: pre-wrap; word-break: break-word;
      color: var(--text);
      max-width: 85%;
    }
    .msg-row.ai .msg-content {
      background: none; padding: 0;
      border-radius: 0;
      max-width: 100%;
    }

    /* Message content markdown styling */
    .msg-content p { margin: 0 0 0.65em; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 700; color: var(--text); }
    .msg-content em { font-style: italic; }
    .msg-content code {
      font-family: var(--mono); font-size: 0.84em;
      background: var(--surface-hover); color: var(--accent);
      padding: 0.1em 0.35em; border-radius: 5px;
    }
    .msg-content pre {
      margin: 0.6em 0; padding: 0.85em 1em;
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); overflow-x: auto;
      font-family: var(--mono); font-size: 0.84em;
      white-space: pre-wrap;
    }
    .msg-content pre code { background: none; padding: 0; color: var(--text-soft); }
    .msg-content a { color: var(--accent); text-decoration: none; font-weight: 500; border-bottom: 1px solid rgba(37,99,235,0.25); transition: all var(--transition); }
    .msg-content a:hover { border-bottom-color: var(--accent); }
    .msg-content ul, .msg-content ol { margin: 0.4em 0; padding-left: 1.4em; }
    .msg-content li { margin-bottom: 0.2em; }
    .msg-content .msg-heading { display: block; font-weight: 700; font-size: 1.02em; color: var(--text); margin: 0.7em 0 0.2em; }
    .msg-content .msg-heading:first-child { margin-top: 0; }

    /* Snippet card */
    .ai-snippet {
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); margin: 0.6em 0;
      overflow: hidden;
    }
    .ai-snippet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.8rem;
      background: var(--surface-hover); border-bottom: 1px solid var(--border-solid);
      font-size: 0.72rem; color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .ai-snippet-copy {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); padding: 0.15rem 0.3rem; border-radius: 4px;
      font-size: 0.8rem; line-height: 1; display: flex; align-items: center;
      transition: all var(--transition);
    }
    .ai-snippet-copy:hover { background: var(--border-solid); color: var(--text); }
    .ai-snippet-copy.copied { color: var(--accent); }
    .ai-snippet-body pre {
      margin: 0 !important; border: none !important; border-radius: 0 !important;
      background: transparent !important; padding: 0.75rem 1rem !important;
    }

    /* Table */
    .table-wrap { overflow-x: auto; margin: 0.6em 0; border-radius: var(--radius); border: 1px solid var(--border-solid); }
    .msg-content table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    .msg-content th, .msg-content td { padding: 0.45em 0.75em; text-align: left; border-bottom: 1px solid var(--border-solid); }
    .msg-content th { font-weight: 700; color: var(--text); background: var(--surface); }
    .msg-content tbody tr:last-child td { border-bottom: none; }

    /* Attachment badge */
    .attach-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.28rem 0.55rem; margin-top: 0.35rem;
      background: var(--surface); border: 1px solid var(--border-solid); border-radius: 99px;
      font-size: 0.75rem; color: var(--text-dim); font-weight: 500;
    }
    .attach-badge svg, .attach-badge img { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; }

    /* Message actions */
    .msg-actions {
      display: flex; gap: 0.25rem;
      margin-top: 0.35rem;
      opacity: 0; transition: opacity var(--transition);
    }
    .msg-row:hover .msg-actions,
    .msg-row:focus-within .msg-actions { opacity: 1; }
    .msg-row.user .msg-actions { flex-direction: row-reverse; }
    .action-btn {
      display: flex; align-items: center; gap: 0.3rem;
      padding: 0.22rem 0.5rem; background: none; border: 1px solid var(--border-solid);
      border-radius: 99px; font: inherit; font-size: 0.75rem; font-weight: 500;
      color: var(--text-dim); cursor: pointer; transition: all var(--transition);
      line-height: 1;
    }
    .action-btn:hover { background: var(--surface-hover); color: var(--text); }
    .action-btn.copied { color: var(--accent); border-color: var(--accent); }
    .action-btn svg { width: 12px; height: 12px; }

    /* ─── Streaming cursor ────────────────────────────────── */
    .msg-content.streaming::after {
      content: "▋"; color: var(--accent);
      animation: blink-cursor 0.8s step-end infinite;
    }
    @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ─── Typing indicator ───────────────────────────────── */
    .typing-dots {
      display: inline-flex; gap: 4px; align-items: center;
      padding: 0.1em 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── Voice buttons ───────────────────────────────────── */
    .mic-btn.listening {
      color: #ef4444 !important; border-color: #ef4444 !important;
      background: rgba(239,68,68,0.08) !important;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.35); }
      50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
    }
    .voice-mode-btn.active {
      color: var(--accent) !important; border-color: var(--accent) !important;
      background: var(--accent-soft) !important;
    }
    .no-speech .mic-btn, .no-speech .voice-mode-btn { display: none !important; }

    /* ─── Form area ───────────────────────────────────────── */
    .form-area {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem 1rem;
      background: var(--bg);
      position: relative; z-index: 10;
    }
    /* fade from transparent to bg above the form */
    .form-area::before {
      content: ""; pointer-events: none;
      position: absolute; top: -32px; left: 0; right: 0; height: 32px;
      background: linear-gradient(to bottom, transparent, var(--bg));
    }
    .form-inner {
      max-width: 720px; margin: 0 auto;
    }

    /* file chosen */
    .file-chosen-bar {
      display: none; align-items: center; gap: 0.35rem;
      padding: 0.35rem 0.75rem; margin-bottom: 0.45rem;
      background: var(--surface); border: 1px solid var(--border-solid);
      border-radius: var(--radius); font-size: 0.78rem; color: var(--text-dim);
      max-width: 100%;
    }
    .file-chosen-bar.visible { display: flex; }
    .file-chosen-bar .fc-name { color: var(--text-soft); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chosen-bar .fc-clear {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: var(--text-dim); padding: 0.1rem; line-height: 1; flex-shrink: 0;
      transition: color var(--transition);
    }
    .file-chosen-bar .fc-clear:hover { color: var(--text); }
    .file-chosen-bar img, .file-chosen-bar svg { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; }

    .blocked-banner {
      display: flex; align-items: center; justify-content: center;
      padding: 0.6rem 0.75rem; margin-bottom: 0.5rem;
      background: rgba(185, 28, 28, 0.12); border: 1px solid rgba(185, 28, 28, 0.35);
      border-radius: var(--radius-md); color: var(--text);
      font-size: 0.875rem; text-align: center; line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      .blocked-banner { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
    }
    form.blocked .form-box { opacity: 0.65; pointer-events: none; }

    /* the input box */
    .form-box {
      display: flex; align-items: flex-end; gap: 0.4rem;
      padding: 0.6rem 0.6rem 0.6rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border-solid);
      border-radius: var(--radius-lg);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-box:focus-within {
      border-color: rgba(37,99,235,0.5);
      box-shadow: 0 2px 20px rgba(37,99,235,0.12), 0 0 0 3px rgba(37,99,235,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .form-box { box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
      .form-box:focus-within { box-shadow: 0 2px 20px rgba(96,165,250,0.2), 0 0 0 3px rgba(96,165,250,0.1); }
    }

    .form-input-wrap { flex: 1; min-width: 0; }
    #input {
      width: 100%; min-height: 26px; max-height: 200px;
      padding: 0.2rem 0; margin: 0;
      background: none; border: none; outline: none;
      color: var(--text); font: inherit; font-size: 0.97rem; line-height: 1.6;
      resize: none; overflow-y: auto;
      -webkit-text-size-adjust: 100%;
    }
    #input::placeholder { color: var(--text-dim); }

    .form-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; min-width: 36px; min-height: 36px;
      background: none; border: 1px solid var(--border-solid); border-radius: 99px;
      color: var(--text-dim); cursor: pointer; flex-shrink: 0;
      transition: all var(--transition); touch-action: manipulation;
    }
    .form-btn:hover { background: var(--surface-hover); color: var(--text); }
    .form-btn svg { width: 17px; height: 17px; }
    .form-btn.send-btn {
      background: var(--accent); border-color: var(--accent); color: #fff;
      opacity: 0; pointer-events: none;
      transform: scale(0.85);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .form-btn.send-btn.active {
      opacity: 1; pointer-events: auto; transform: scale(1);
    }
    .form-btn.send-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .form-btn.send-btn:active { transform: scale(0.93); }
    .form-btn.send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }

    .form-hint {
      text-align: center; font-size: 0.7rem; color: var(--text-dim);
      margin-top: 0.5rem; opacity: 0.85;
      font-weight: 400; letter-spacing: 0.02em;
    }
    /* EU AI Act Art. 50 / German law: transparency and legal footer */
    .form-legal-line {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem 1rem;
      flex-wrap: nowrap; min-height: 2rem; margin-bottom: 0.5rem;
      font-size: 0.7rem; color: var(--text-dim);
    }
    .form-legal-line .ai-disclosure {
      display: flex; align-items: center; gap: 0.35rem; min-width: 0; flex: 1 1 auto;
    }
    .form-legal-line .ai-disclosure svg { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.7; }
    .form-legal-line .form-hint { flex-shrink: 0; margin: 0; white-space: nowrap; }
    @media (max-width: 480px) {
      .form-legal-line { flex-wrap: wrap; }
    }

    /* ─── Mobile layout ────────────────────────────────────── */
    @media (max-width: 767px) {
      html, body { font-size: 15px; }
      .history-rail {
        width: auto;
        height: auto;
        position: fixed;
        top: calc(0.9rem + env(safe-area-inset-top, 0px));
        left: 0.5rem;
        padding: 0;
        background: transparent;
        border-right: none;
        box-shadow: none;
        z-index: 20;
      }
      .sidebar { box-shadow: none; }
      .history-rail .icon-btn {
        width: auto;
        height: auto;
        min-width: 32px;
        min-height: 32px;
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border-solid);
        background: var(--bg);
      }
      .topbar-title {
        display: none;
      }
      .form-area { padding: 0.6rem 0.75rem calc(0.6rem + env(safe-area-inset-bottom, 0px)); }
      .chat-inner { padding: 0.75rem 0.65rem 0.25rem; }
      .form-box { border-radius: 16px; }
      .welcome { padding: 1.5rem 1rem 1rem; }
      .welcome-title { font-size: 1.45rem; }
      .welcome-icon-wrap { width: 120px; height: 120px; }
      .welcome-icon-wrap img { width: 70px; height: 70px; }
      #input { font-size: 16px; }
    }

    /* ─── Wide desktop ─────────────────────────────────────── */
    @media (min-width: 1100px) {
      .chat-inner { max-width: 820px; }
      .form-inner { max-width: 820px; }
    }

    /* ─── Voice button in form bar ───────────────────────── */
    .voice-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: auto;
      min-width: 0;
      padding: 0 0.85rem;
      background: var(--surface);
      border-color: var(--border-solid);
      color: var(--text-dim);
      border-radius: 999px;
    }
    .voice-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-solid);
      color: var(--accent);
    }
    .voice-btn svg { width: 16px; height: 16px; }
    .voice-btn-label { font-size: 0.8rem; font-weight: 600; }
    .no-speech-hide { display: none !important; }

    /* ─── Voice overlay ───────────────────────────────────── */
    .voice-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .voice-overlay.show { display: flex !important; }

    .vo-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0c1a3a 0%, #0a0f1e 60%, #051020 100%);
    }

    .vo-body {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.5rem;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
      animation: vo-in 0.35s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    @keyframes vo-in {
      from { opacity: 0; transform: scale(0.88) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Orb */
    .vo-orb-wrap {
      position: relative;
      width: 160px; height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    .vo-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .vo-orb {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #2d9cdb 0%, #1a6fa8 40%, #0d4f80 100%);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 0 0 rgba(96,165,250,0);
      position: relative; z-index: 1;
    }
    .vo-orb.listening {
      animation: orb-breathe 1.8s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(96,165,250,0.45), 0 0 80px rgba(96,165,250,0.2);
    }
    .vo-orb.speaking {
      animation: orb-pulse 0.6s ease-in-out infinite alternate;
      box-shadow: 0 0 50px rgba(52,211,153,0.5), 0 0 100px rgba(52,211,153,0.2);
      background: radial-gradient(circle at 38% 35%, #34d399 0%, #059669 40%, #047857 100%);
    }
    .vo-orb.thinking {
      animation: orb-spin-glow 2s linear infinite;
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
      background: radial-gradient(circle at 38% 35%, #a78bfa 0%, #7c3aed 40%, #5b21b6 100%);
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes orb-pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.12); }
    }
    @keyframes orb-spin-glow {
      0%   { box-shadow: 0 0 30px rgba(167,139,250,0.4), 4px 0 20px rgba(167,139,250,0.25); }
      50%  { box-shadow: 0 0 40px rgba(167,139,250,0.5), -4px 0 20px rgba(167,139,250,0.25); }
      100% { box-shadow: 0 0 30px rgba(167,139,250,0.4), 4px 0 20px rgba(167,139,250,0.25); }
    }
    .vo-orb-img {
      width: 44px; height: 44px; object-fit: contain;
      filter: brightness(0) invert(1);
      border-radius: 8px;
    }

    /* State label */
    .vo-state {
      display: none; /* voice overlay is visual-only: no status text */
    }

    /* Live transcript */
    .vo-transcript {
      display: none; /* hide text transcript in speaking page */
    }
    .vo-transcript .vo-interim { color: rgba(255,255,255,0.45); }
    .vo-transcript .vo-final   { color: #fff; }

    /* Controls */
    .vo-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }
    .vo-mic-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s ease;
      backdrop-filter: blur(8px);
    }
    .vo-mic-btn svg { width: 26px; height: 26px; }
    .vo-mic-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
    .vo-mic-btn.active {
      background: rgba(96,165,250,0.25);
      border-color: rgba(96,165,250,0.7);
      color: #93c5fd;
      animation: mic-pulse-overlay 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse-overlay {
      0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); }
      50%      { box-shadow: 0 0 0 10px rgba(96,165,250,0); }
    }
    .vo-stop-btn {
      display: flex; align-items: center; gap: 0.45rem;
      padding: 0.65rem 1.35rem; border-radius: 99px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      font: inherit; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s ease;
      backdrop-filter: blur(8px);
    }
    .vo-stop-btn svg { width: 15px; height: 15px; }
    .vo-stop-btn:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); color: #fca5a5; }

    /* ─── Accessibility ────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -100px; left: 0.5rem;
      padding: 0.4rem 0.7rem; background: var(--accent); color: #fff;
      border-radius: var(--radius); font-size: 0.85rem; font-weight: 500;
      z-index: 9999; transition: top 0.2s; text-decoration: none;
    }
    .skip-link:focus { top: 0.5rem; outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  </style>
</head>

            <div class="form-input-wrap">
              <textarea id="input" placeholder="Ask me anything..." data-i18n-attr="placeholder:inputPlaceholder" rows="1"></textarea>
            </div>
            <button type="button" class="form-btn" id="attach-file-btn" aria-label="Attach file" title="Attach file (PDF, image, etc)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 0 18.8-4.3M22 12.5a10 10 0 0 0-18.8 4.2"/></svg>
            </button>
            <button type="button" class="form-btn voice-btn no-speech-hide" id="voice-input-btn" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v12a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button type="submit" class="form-btn send-btn" aria-label="Send message" id="send-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="m16.6915026,12.4744748 l-8.98950899,8.98950899 c-0.37003155,0.37003155 -0.9447788,0.37003155 -1.31480839,0 c-0.37003156,-0.37003156 -0.37003156,-0.9447788 0,-1.31480839 l8.98950899,-8.98950899 l-8.98950899,-8.98950899 c-0.37003156,-0.37003156 -0.37003156,-0.9447788 0,-1.31480839 c0.37003159,-0.37003156 0.9447788,-0.37003156 1.31480839,0 l8.98950899,8.98950899 l8.98950899,-8.98950899 c0.37003155,-0.37003156 0.9447788,-0.37003156 1.31480839,0 c0.37003156,0.37003156 0.37003156,0.9447788 0,1.31480839 l-8.98950899,8.98950899 l8.98950899,8.98950899 c0.37003156,0.37003156 0.37003156,0.9447788 0,1.31480839 c-0.37003159,0.37003155 -0.9447788,0.37003155 -1.31480839,0 l-8.98950899,-8.98950899 z"/></svg>
            </button>
          </form>
          <div class="form-legal-line">
            <div class="ai-disclosure">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
              <span data-i18n="aiDisclosure">This uses AI</span>
            </div>
            <div class="form-hint" data-i18n="formHint">Shift + Enter for new line</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Voice overlay -->
  <div class="voice-overlay" id="voice-overlay">
    <div class="vo-bg"></div>
    <div class="vo-body">
      <div class="vo-orb-wrap">
        <canvas class="vo-canvas" id="vo-canvas"></canvas>
        <div class="vo-orb" id="vo-orb">
          <img src="/images/g.png" alt="" class="vo-orb-img" />
        </div>
      </div>
      <div class="vo-state" id="vo-state"></div>
      <div class="vo-transcript" id="vo-transcript">
        <div class="vo-interim" id="vo-interim"></div>
        <div class="vo-final" id="vo-final"></div>
      </div>
      <div class="vo-controls">
        <button type="button" class="vo-mic-btn" id="vo-mic-btn" aria-label="Toggle microphone">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 16.91c-1.48 1.46-3.51 2.36-5.76 2.36-2.25 0-4.28-.9-5.76-2.36m13.68 0A9.005 9.005 0 0 0 12 3c-4.97 0-9 4.03-9 9m13.68 0l1.41 1.41M4.59 16.91L3.18 18.32"/></svg>
        </button>
        <button type="button" class="vo-stop-btn" id="vo-stop-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h12v12H6z"/></svg>
          <span data-i18n="stopListening">Stop</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ─── Rotating greetings system ───
    const greetings = [
      { emoji: '👋', text: 'Welcome back! What\'s on your mind today?' },
      { emoji: '🤖', text: 'Ready to assist! What can I help you with?' },
      { emoji: '💡', text: 'Looking for ideas? Ask me anything!' },
      { emoji: '🚀', text: 'Let\'s explore something new together!' },
      { emoji: '✨', text: 'How can I make your day easier?' },
      { emoji: '📚', text: 'Got questions? I\'m here to help!' },
      { emoji: '🎯', text: 'What would you like to discover today?' },
      { emoji: '💬', text: 'Let\'s have an interesting conversation!' },
      { emoji: '🌟', text: 'Ready to chat? What interests you?' },
      { emoji: '🔍', text: 'Looking for information? Just ask!' }
    ];

    function updateGreeting() {
      const greeting = greetings[Math.floor(Math.random() * greetings.length)];
      const emojiEl = document.getElementById('greeting-emoji');
      const textEl = document.getElementById('greeting-text');
      
      if (emojiEl && textEl) {
        emojiEl.textContent = greeting.emoji;
        textEl.textContent = greeting.text;
      }
    }

    // Update greeting on page load and periodically
    document.addEventListener('DOMContentLoaded', () => {
      updateGreeting();
      // Change greeting every 8 seconds when on welcome screen
      setInterval(() => {
        const welcomeState = document.getElementById('welcome-state');
        if (welcomeState && welcomeState.offsetParent !== null) {
          updateGreeting();
        }
      }, 8000);
    });
  </script>
</body>
</html>
