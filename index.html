<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>General</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #16161a;
      --border: #2a2a30;
      --text: #eae9e6;
      --text-dim: #8a8986;
      --accent: #d4a853;
      --accent-soft: rgba(212, 168, 83, 0.18);
      --user-bg: #222228;
      --ai-bg: #1a1a1f;
      --radius: 12px;
      --font: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-weight: 500; }
    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 1.25rem 1rem 1.5rem; }
    .header { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 1.1rem; }
    .logo-icon { color: var(--accent); font-size: 1rem; }
    .tagline { margin: 0.35rem 0 0 1.4rem; font-size: 0.8rem; color: var(--text-dim); }
    .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem 0; }
    .message { padding: 1rem 1.15rem; border-radius: var(--radius); max-width: 90%; }
    .message .label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; color: var(--text-dim); }
    .message p { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .message strong { font-weight: 700; }
    .message em { font-style: italic; font-weight: 500; }
    .message code { font-family: var(--mono); font-size: 0.88em; font-weight: 400; background: var(--accent-soft); color: var(--accent); padding: 0.12em 0.35em; border-radius: 4px; }
    .message pre { margin: 0.5em 0; padding: 0.6em 0.75em; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; font-size: 0.88em; font-family: var(--mono); font-weight: 400; white-space: pre-wrap; }
    .message pre code { background: none; padding: 0; }
    .message a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .message a:hover { text-decoration: none; }
    .message .msg-heading { display: block; font-weight: 700; font-size: 1.05em; margin: 0.6em 0 0.25em; }
    .message .msg-heading:first-child { margin-top: 0; }
    .message ul { margin: 0.35em 0; padding-left: 1.25em; }
    .message.user { align-self: flex-end; background: var(--user-bg); border: 1px solid var(--border); }
    .message.user .label { color: var(--accent); }
    .message.ai { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--border); }
    .form-wrap { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    .form { display: flex; gap: 0.65rem; align-items: flex-end; }
    .form textarea { flex: 1; min-height: 46px; max-height: 150px; padding: 0.8rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 0.95rem; resize: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form textarea::placeholder { color: var(--text-dim); }
    .form textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .form button { padding: 0.8rem 1.2rem; background: var(--accent); color: #0c0c0e; border: none; border-radius: var(--radius); font-family: var(--font); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: filter 0.2s, transform 0.1s; }
    .form button:hover { filter: brightness(1.12); }
    .form button:active { transform: scale(0.98); }
    .form button:disabled { opacity: 0.6; cursor: not-allowed; }
    .attach-btn { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-dim); cursor: pointer; transition: color 0.2s, border-color 0.2s; flex-shrink: 0; }
    .attach-btn:hover { color: var(--accent); border-color: var(--accent); }
    .attach-btn svg { width: 20px; height: 20px; }
    .file-chosen { margin-top: 0.35rem; font-size: 0.75rem; color: var(--text-dim); }
    .file-chosen span { color: var(--accent); }
    .hint { margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-dim); }
    .typing { opacity: 0.75; }
    .typing .label::after { content: " …"; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots { 0%, 20% { content: " …"; } 40% { content: " ."; } 60% { content: " .."; } 80%, 100% { content: " …"; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo"><span class="logo-icon">◇</span><span>General</span></div>
      <p class="tagline">Wikipedia, search, and AI. Short answers.</p>
    </header>
    <section class="chat" id="chat">
      <div class="message ai">
        <span class="label">General</span>
        <p>Hi. I'm General. Ask me anything — I look it up with Wikipedia, web search, weather, definitions, news, and AI.</p>
      </div>
    </section>
    <div class="form-wrap">
      <form class="form" id="form">
        <label for="file-input" class="attach-btn" aria-label="Attach image or PDF" title="Attach image or PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </label>
        <input type="file" id="file-input" accept="image/*,.pdf" style="display:none">
        <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button type="submit" id="send" aria-label="Send">Send</button>
      </form>
      <p class="file-chosen" id="file-chosen" style="display:none"><span id="file-name"></span></p>
      <p class="hint">📎 Image & PDF. Wikipedia, weather, dictionary (free). Web: Google CSE, Serper, Brave. News: NewsAPI. LLM: DeepSeek, OpenAI.</p>
    </div>
  </main>
  <script>
    (function () {
      // Fallback when /api/chat fails (offline or not configured)
      const KNOWLEDGE = [
        { patterns: ["hi","hello","hey"], responses: ["Hi. Ask me anything."] },
        { patterns: ["who are you","what are you"], responses: ["General. Wikipedia + search + AI. Ask a question."] },
        { patterns: ["help"], responses: ["Ask a question. Set API keys in Vercel for search and AI."] },
        { patterns: [], responses: ["API not configured. Try 'help' or set keys in Vercel."] }
      ];
      function normalize(t) { return t.replace(/[^\w\s]/g, "").toLowerCase().trim(); }
      function tokenize(t) { return normalize(t).split(/\s+/).filter(Boolean); }
      function scoreMatch(userSet, patternList) { if (!patternList.length) return 0; let n = 0; for (const t of patternList) if (userSet.has(t)) n++; return n / patternList.length; }
      function thinkFallback(msg) {
        const raw = (msg || "").trim();
        if (!raw) return "Ask something.";
        const userSet = new Set(tokenize(raw));
        let best = 0, entry = null;
        for (const e of KNOWLEDGE) { if (!e.patterns.length) continue; for (const p of e.patterns) { const s = scoreMatch(userSet, tokenize(p)); if (s > best) { best = s; entry = e; } } }
        if (entry && best >= 0.3) return entry.responses[0];
        return (KNOWLEDGE.find(e => !e.patterns.length) || {}).responses?.[0] || "No API. Ask 'help'.";
      }

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const fileInput = document.getElementById("file-input");
      const fileChosen = document.getElementById("file-chosen");
      const fileNameEl = document.getElementById("file-name");
      let chosenFile = null;

      fileInput.addEventListener("change", function() {
        chosenFile = fileInput.files?.[0] || null;
        if (chosenFile) { fileNameEl.textContent = chosenFile.name; fileChosen.style.display = ""; }
        else { fileNameEl.textContent = ""; fileChosen.style.display = "none"; }
      });

      function formatMsg(t) {
        if (!t) return "";
        let s = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        s = s.replace(/```\n?([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        s = s.replace(/_([^_]+)_/g, "<em>$1</em>");
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, txt, url) { var u = /^https?:\/\//i.test(url) ? url.replace(/&/g,"&amp;").replace(/"/g,"&quot;") : "#"; return "<a href=\"" + u + "\" target=\"_blank\" rel=\"noopener\">" + txt + "</a>"; });
        s = s.replace(/^## (.+)$/gm, "<span class=\"msg-heading\">$1</span>");
        s = s.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
        s = s.replace(/((?:<li>[\s\S]*?<\/li>\n?)+)/g, "<ul>$1</ul>");
        return s;
      }

      function addMessage(role, text, label) {
        const d = document.createElement("div");
        d.className = "message " + role;
        d.innerHTML = "<span class=\"label\">" + (label || (role === "user" ? "You" : "General")) + "</span><p></p>";
        d.querySelector("p").innerHTML = formatMsg(text);
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
      }

      function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 150) + "px"; }
      input.addEventListener("input", resize);
      input.addEventListener("keydown", function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

      function addTyping() {
        const d = document.createElement("div");
        d.className = "message ai typing";
        d.innerHTML = "<span class=\"label\">General</span><p>Searching…</p>";
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
      }

      let history = [];

      const MAX_FILE = 3 * 1024 * 1024; // 3 MB (keeps JSON under Vercel 4.5MB)
      function toBase64(buf) {
        const u = new Uint8Array(buf);
        let s = "";
        for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
        return btoa(s);
      }

      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const raw = input.value.trim();
        const file = chosenFile;
        if (!raw && !file) return;
        const displayMsg = raw || (file ? "[" + file.name + "]" : "");
        if (file && file.size > MAX_FILE) {
          addMessage("user", displayMsg);
          addMessage("ai", "File too large. Use a PDF or image under 3 MB.");
          chosenFile = null; fileInput.value = ""; fileNameEl.textContent = ""; fileChosen.style.display = "none";
          return;
        }
        addMessage("user", displayMsg);
        input.value = "";
        if (file) { chosenFile = null; fileInput.value = ""; fileNameEl.textContent = ""; fileChosen.style.display = "none"; }
        resize();
        send.disabled = true;
        const typingEl = addTyping();

        try {
          const body = { message: raw || (file ? "What is in this file?" : "") };
          if (file) {
            const buf = await file.arrayBuffer();
            const isPdf = (file.type || "").toLowerCase() === "application/pdf";
            if (isPdf) body.pdf = toBase64(buf); else body.image = toBase64(buf);
          }
          body.history = history.slice(-20);
          const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          let data;
          try { data = await res.json(); } catch (_) { data = { reply: res.status === 413 ? "File too large. Use under 3 MB." : "Request failed. Set DEEPSEEK_API_KEY in Vercel and try again." }; }
          typingEl.remove();
          const reply = (data && data.reply) ? data.reply : (data && data.error) ? data.error : "No reply.";
          addMessage("ai", reply);
          history.push({ role: "user", content: body.message });
          history.push({ role: "assistant", content: reply });
        } catch (err) {
          typingEl.remove();
          addMessage("ai", file ? "Upload failed. Use a file under 3 MB and set DEEPSEEK_API_KEY in Vercel. Try again." : thinkFallback(displayMsg));
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      input.focus();
    })();
  </script>
</body>
</html>
