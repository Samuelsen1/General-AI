<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes, interactive-widget=resizes-content" />
  <meta name="format-detection" content="telephone=no" />
  <title>General</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-gradient: none;
      --surface: #e0f2fe; /* light sea-blue for history panel and input bar */
      --border: #bfdbfe;
      --border-soft: #e5f3ff;
      --text: #0f172a;
      --text-soft: #1f2937;
      --text-dim: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --accent-soft-2: rgba(37, 99, 235, 0.06);
      --user-bg: #dbeafe; /* azure-like user bubble */
      --user-border: #bfdbfe;
      --ai-bg: transparent;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 20px 55px rgba(15, 23, 42, 0.12);
      --font: "DM Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; min-height: 100%; background: var(--bg); background-image: var(--bg-gradient); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-weight: 500; overflow: hidden; }
    .app-wrap { display: flex; flex-direction: row; height: 100vh; min-height: 100vh; overflow: hidden; }
    @supports (height: 100dvh) {
      @media (max-width: 767px) {
        .app-wrap { height: 100dvh; min-height: 100dvh; }
      }
    }
    @media (max-width: 767px) {
      .app-wrap { height: calc(var(--vh, 1vh) * 100); min-height: calc(var(--vh, 1vh) * 100); }
    }
    .history-rail { width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 1rem; background: var(--surface); border-right: 1px solid var(--border); position: relative; z-index: 60; }
    .sidebar { position: fixed; left: 48px; top: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 50; transform: translateX(-100%); transition: transform 0.2s; box-shadow: 4px 0 20px rgba(0,0,0,0.08); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { flex-shrink: 0; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
    .sidebar-header .logo { font-weight: 700; font-size: 1.05rem; color: var(--text); display: flex; align-items: center; gap: 0.4rem; }
    .sidebar-header .logo-icon { color: var(--accent); width: 1.25em; height: 1.25em; object-fit: contain; display: inline-block; vertical-align: middle; }
    .sidebar-title { flex-shrink: 0; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin: 1rem 1.25rem 0.5rem; }
    .sidebar-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0.75rem 0.75rem; }
    .sidebar-list li { list-style: none; margin: 0 0 0.25rem; padding: 0.5rem 0.65rem; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; color: var(--text-soft); line-height: 1.35; }
    .sidebar-list li:hover { background: var(--accent-soft-2); color: var(--accent); }
    .sidebar-list li.you { border-left: 2px solid transparent; }
    .sidebar-list li.general { border-left: 2px solid var(--accent-soft); padding-left: 0.5rem; }
    .sidebar-empty { padding: 1rem 1.25rem; font-size: 0.8rem; color: var(--text-dim); }
    .sidebar-footer { flex-shrink: 0; padding: 0.75rem 1rem; border-top: 1px solid var(--border); }
    .sidebar-footer .new-chat { width: 100%; padding: 0.6rem 1rem; min-height: 44px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font: inherit; font-size: 0.85rem; font-weight: 500; color: var(--text-soft); cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; touch-action: manipulation; }
    .sidebar-footer .new-chat:hover { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 40; }
    .sidebar-overlay.visible { display: block; }
    .history-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; background: none; border: none; border-radius: var(--radius-sm); color: var(--text-dim); cursor: pointer; touch-action: manipulation; flex-shrink: 0; }
    .history-btn:hover { background: var(--accent-soft-2); color: var(--accent); }
    .history-btn svg { width: 22px; height: 22px; }
    @media (max-width: 767px) {
      .history-rail { width: 44px; padding-top: calc(0.75rem + env(safe-area-inset-top, 0px) + 8px); }
      .sidebar { left: 44px; max-width: 85vw; padding-left: env(safe-area-inset-left, 0); padding-top: calc(env(safe-area-inset-top, 0px) + 8px); }
      .app { padding: calc(1rem + env(safe-area-inset-top, 0px) + 8px) 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px) + 60px) 1rem; }
      .header { margin-bottom: 1rem; padding-bottom: 0.75rem; padding-top: 0; }
      .tagline { margin: 0.35rem 0 0 0; font-size: 0.8rem; }
      .message { padding: 0.9rem 1rem; max-width: 95%; }
      .message pre, .message code { font-size: 0.82em; }
      .form { padding: 0.4rem; gap: 0.5rem; }
      .form #input { font-size: 16px !important; padding: 0.75rem 0.85rem; min-height: 48px; -webkit-text-size-adjust: 100%; }
      .form button { padding: 0.75rem 1rem; font-size: 0.9rem; }
      .form-wrap { padding-top: 1rem; padding-bottom: env(safe-area-inset-bottom, 0px); }
      .hint { font-size: 0.7rem; }
    }
    @media (max-width: 480px) {
      .app { padding: calc(0.75rem + env(safe-area-inset-top, 0px) + 8px) 0.75rem calc(1rem + env(safe-area-inset-bottom, 0px) + 60px) 0.75rem; }
      .history-rail { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px) + 8px); }
      .header { margin-bottom: 0.75rem; padding-bottom: 0.6rem; }
      .message { padding: 0.75rem 0.85rem; }
      .form { padding: 0.35rem; gap: 0.4rem; }
      .form #input { padding: 0.7rem 0.75rem; }
      .form button { padding: 0.7rem 0.9rem; font-size: 0.85rem; }
    }
    .app { flex: 1; max-width: 640px; margin: 0 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 1.8rem 1.4rem 1.9rem; overflow: hidden; position: relative; z-index: 1; }
    .header { flex-shrink: 0; margin-bottom: 1.6rem; padding-bottom: 1.15rem; border-bottom: 1px solid rgba(148, 163, 184, 0.4); position: relative; }
    .header::after { content: ""; position: absolute; bottom: -2px; left: 0; width: 72px; height: 2px; background: linear-gradient(90deg, #38bdf8, #6366f1, #ec4899); border-radius: 999px; box-shadow: 0 0 12px rgba(129, 140, 248, 0.7); }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .lang-toggle { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-soft); cursor: pointer; transition: all 0.2s; }
    .lang-toggle:hover { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent); }
    .lang-toggle svg { width: 16px; height: 16px; }
    .logo { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.18rem; color: var(--text); letter-spacing: -0.03em; }
    .logo .logo-icon { width: 1.25em; height: 1.25em; object-fit: contain; display: inline-block; vertical-align: middle; }
    .logo .logo-icon.logo-fallback { width: auto; height: auto; object-fit: none; font-size: 1.25em; color: var(--accent); }
    .tagline { margin: 0.4rem 0 0 1.5rem; font-size: 0.8rem; color: var(--text-dim); font-weight: 400; }
    .chat { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 1.15rem; padding: 0.25rem 0; }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: rgba(30, 64, 175, 0.4); border-radius: 999px; }
    .message { padding: 0.2rem 0.1rem 0.5rem; max-width: 100%; background: transparent; box-shadow: none; border: none; transition: none; position: relative; }
    .message:hover { box-shadow: none; transform: none; border-color: transparent; }
    .message .label { display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.35rem; color: var(--text-dim); }
    .message p { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--text-soft); }
    .message strong { font-weight: 700; color: var(--text); }
    .message em { font-style: italic; font-weight: 500; }
    .message code { font-family: var(--mono); font-size: 0.86em; font-weight: 400; background: var(--accent-soft); color: var(--accent); padding: 0.15em 0.4em; border-radius: 6px; }
    .message pre { margin: 0.5em 0; padding: 0.75em 1em; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow-x: auto; font-size: 0.86em; font-family: var(--mono); font-weight: 400; white-space: pre-wrap; }
    .message pre code { background: none; padding: 0; color: var(--text-soft); }
    .message a { color: var(--accent); text-decoration: none; font-weight: 500; border-bottom: 1px solid rgba(37,99,235,0.3); transition: border-color 0.2s, color 0.2s; }
    .message a:hover { color: var(--accent-hover); border-bottom-color: var(--accent); }
    .message .msg-heading { display: block; font-weight: 700; font-size: 1.05em; margin: 0.6em 0 0.25em; color: var(--text); }
    .message .msg-heading:first-child { margin-top: 0; }
    .message ul { margin: 0.4em 0; padding-left: 1.35em; }
    .message-body { border-radius: var(--radius); padding: 0.85rem 1rem; max-width: 88%; }
    .message.user { align-self: flex-end; }
    .message.user .message-body { background: #dbeafe; border-radius: var(--radius); border: 1px solid #bfdbfe; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12); margin-left: auto; }
    .message.user .label { color: var(--accent); }
    .message.ai { align-self: flex-start; max-width: 100%; }
    .message.ai .message-body { background: transparent; padding: 0.4rem 0; max-width: 100%; }
    .message-actions { display: flex; gap: 0.4rem; margin-top: 0.2rem; opacity: 0; transition: opacity 0.2s; }
    .message.user .message-actions { justify-content: flex-end; }
    .message.ai .message-actions { justify-content: flex-start; }
    .message:hover .message-actions { opacity: 1; }
    .copy-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); padding: 0.2rem 0.4rem; border-radius: 999px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .copy-btn:hover { background: var(--border-soft); color: var(--text); }
    .copy-btn:active { transform: scale(0.95); }
    .copy-btn.copied { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .ai-snippet { background: #ffffff; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0.7rem 0.85rem; margin-top: 0.6rem; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); }
    .ai-snippet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .ai-snippet-title { font-weight: 600; }
    .ai-snippet-copy { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); padding: 0.16rem 0.38rem; border-radius: 999px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .ai-snippet-copy:hover { background: var(--border-soft); color: var(--text); }
    .ai-snippet-copy:active { transform: scale(0.95); }
    .ai-snippet-copy.copied { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .attachment-badge-wrap { margin-top: 0.35rem; max-width: 88%; }
    .message.user .attachment-badge-wrap { margin-left: auto; }
    .attachment-badge { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.65rem; background: rgba(255,255,255,0.9); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-soft); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06); }
    .attachment-badge svg { flex-shrink: 0; color: #dc2626; }
    .attachment-badge .attachment-name { font-weight: 500; color: var(--text); }
    .form-wrap { flex-shrink: 0; margin-top: auto; padding-top: 1.25rem; border-top: 1px solid var(--border); position: relative; z-index: 10; }
    .form { display: flex; gap: 0.6rem; align-items: flex-end; padding: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .form #input { flex: 1; min-width: 0; min-height: 48px; padding: 0.85rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 16px; transition: border-color 0.2s, box-shadow 0.2s; -webkit-text-size-adjust: 100%; }
    .form #input::placeholder { color: var(--text-dim); }
    .form #input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .form button { padding: 0.85rem 1.35rem; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-family: var(--font); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s, transform 0.1s; touch-action: manipulation; }
    .form button:hover { background: var(--accent-hover); }
    .form button:active { transform: scale(0.98); }
    .form button:disabled { opacity: 0.6; cursor: not-allowed; }
    .attach-btn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; min-width: 48px; min-height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-dim); cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; flex-shrink: 0; touch-action: manipulation; }
    .attach-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft-2); }
    .attach-btn svg { width: 20px; height: 20px; }
    .create-gen-wrap { position: relative; flex-shrink: 0; }
    .create-gen-btn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; min-width: 48px; min-height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; touch-action: manipulation; }
    .create-gen-btn:hover { border-color: var(--accent); background: var(--accent-soft-2); box-shadow: 0 2px 10px rgba(37, 99, 235, 0.12); }
    .create-gen-btn:active { transform: scale(0.98); }
    .create-gen-btn svg { width: 30px; height: 30px; flex-shrink: 0; }
    .create-gen-dropdown { position: absolute; bottom: 100%; left: 0; margin-bottom: 0.35rem; min-width: 200px; padding: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 100; display: none; }
    .create-gen-dropdown.open { display: block; }
    .create-gen-dropdown .create-opt { display: flex; align-items: center; gap: 0.6rem; width: 100%; padding: 0.55rem 0.65rem; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text-soft); font: inherit; font-size: 0.85rem; cursor: pointer; transition: background 0.15s, color 0.15s; text-align: left; }
    .create-gen-dropdown .create-opt:hover { background: var(--accent-soft-2); color: var(--accent); }
    .create-gen-dropdown .create-opt svg { width: 18px; height: 18px; flex-shrink: 0; }
    .create-gen-dropdown .create-opt.disabled { opacity: 0.7; cursor: not-allowed; }
    .create-gen-dropdown .create-opt.disabled:hover { background: transparent; color: var(--text-dim); }
    .create-gen-dropdown .create-footer { margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--text-dim); }
    .file-chosen { margin-top: 0.4rem; font-size: 0.75rem; color: var(--text-dim); }
    .file-chosen span { color: var(--accent); font-weight: 500; }
    .hint { margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-dim); }
    .typing { opacity: 0.85; }
    .typing .label::after { content: " …"; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots { 0%, 20% { content: " …"; } 40% { content: " ."; } 60% { content: " .."; } 80%, 100% { content: " …"; } }

    /* Widen and shift chat area to the right on larger screens (away from history rail) */
    @media (min-width: 960px) {
      .app {
        max-width: 840px;
        margin: 0 10% 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="history-rail">
      <button type="button" class="history-btn" id="history-btn" aria-label="Open history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18M3 8h18M3 12h12M3 16h10"/></svg>
      </button>
    </div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo"><img src="/images/g.png" alt="General" class="logo-icon" onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='images/g.png';return}this.outerHTML='<span class=\'logo-icon logo-fallback\'>◇</span>'" /><span>General</span></div>
      </div>
        <p class="sidebar-title" data-i18n="pastChats">Past chats</p>
      <ul id="past-chats-list" class="sidebar-list"></ul>
      <div class="sidebar-footer">
        <button type="button" id="clear-chat" class="new-chat" data-i18n="newChat">+ New chat</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <main class="app">
      <header class="header">
        <div class="header-row">
          <div class="logo"><img src="/images/g.png" alt="General" class="logo-icon" onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='images/g.png';return}this.outerHTML='<span class=\'logo-icon logo-fallback\'>◇</span>'" /><span>General</span></div>
          <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="lang-text">EN</span>
          </button>
        </div>
      </header>
      <section class="chat" id="chat">
        <div class="message ai">
          <span class="label">General</span>
          <p id="greeting-message">Hello there! I'm General, and I hope you're Good.😉</p>
        </div>
      </section>
      <div class="form-wrap">
        <form class="form" id="form">
          <label for="file-input" class="attach-btn" aria-label="Attach image or PDF" data-i18n-title="attachFile" title="Attach image or PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <input type="file" id="file-input" accept="image/*,.pdf" style="display:none">
          <div class="create-gen-wrap">
            <button type="button" class="create-gen-btn" id="create-gen-btn" aria-label="Create image or video" title="Create image or video">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                <defs><linearGradient id="createBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs>
                <path stroke="url(#createBtnGrad)" d="M9.5 2L11 7l5.5 1.5L11 10l-1.5 5.5L8 10 2.5 8.5 8 7 9.5 2z"/><path stroke="url(#createBtnGrad)" d="M15 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/>
              </svg>
            </button>
            <div class="create-gen-dropdown" id="create-gen-dropdown" role="menu" aria-hidden="true">
              <button type="button" class="create-opt disabled" id="create-opt-image" data-mode="image" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                <span data-i18n="createImage">Generate image</span>
              </button>
              <button type="button" class="create-opt disabled" id="create-opt-video" data-mode="video" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span data-i18n="createVideo">Generate video</span>
              </button>
              <div class="create-footer" data-i18n="createRequiresKey">Requires PIXAZO_API_KEY in Vercel to enable.</div>
            </div>
          </div>
          <input type="text" id="input" placeholder="Ask anything…" data-i18n-placeholder="askAnything" autocomplete="off" enterkeyhint="send" />

    </main>
  </div>
  <script>
    (function () {
      // Language translations
      const translations = {
        en: {
          newChat: "+ New chat",
          pastChats: "Past chats",
          askAnything: "Ask anything…",
          send: "Send",
          attachFile: "Attach image or PDF",
          createImage: "Generate image",
          createVideo: "Generate video",
          createRequiresKey: "Requires PIXAZO_API_KEY in Vercel to enable.",
          createDisabled: "Add PIXAZO_API_KEY in Vercel to enable image and video generation.",
          greeting: "Hello there! I'm General, and I hope you're Good.😉",
          you: "You",
          general: "General",
          searching: "Searching…",
          langCode: "EN"
        },
        de: {
          newChat: "+ Neuer Chat",
          pastChats: "Vergangene Chats",
          askAnything: "Fragen Sie alles…",
          send: "Senden",
          attachFile: "Bild oder PDF anhängen",
          createImage: "Bild erzeugen",
          createVideo: "Video erzeugen",
          createRequiresKey: "PIXAZO_API_KEY in Vercel erforderlich.",
          createDisabled: "PIXAZO_API_KEY in Vercel setzen, um Bild- und Videoerstellung zu aktivieren.",
          greeting: "Hallo! Wie kann ich Ihnen heute helfen? 😊",
          you: "Sie",
          general: "General",
          searching: "Suche…",
          langCode: "DE"
        }
      };

      // Get language from localStorage or default to 'en'
      let currentLang = localStorage.getItem('general_lang') || 'en';
      if (currentLang !== 'en' && currentLang !== 'de') currentLang = 'en';

      // Translation function
      function t(key) {
        return translations[currentLang][key] || translations.en[key] || key;
      }

      // Update UI with translations
      function updateUI() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (key) el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (key) el.placeholder = t(key);
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
          const key = el.getAttribute('data-i18n-title');
          if (key) el.title = t(key);
        });
        const greetingEl = document.getElementById('greeting-message');
        if (greetingEl) greetingEl.textContent = t('greeting');
        const langText = document.getElementById('lang-text');
        if (langText) langText.textContent = t('langCode');
        document.documentElement.lang = currentLang;
      }

      // Language toggle
      const langToggle = document.getElementById('lang-toggle');
      if (langToggle) {
        langToggle.addEventListener('click', function() {
          currentLang = currentLang === 'en' ? 'de' : 'en';
          localStorage.setItem('general_lang', currentLang);
          updateUI();
        });
      }

      // Initialize UI
      updateUI();

      // Fix mobile Chrome viewport height issues
      function setViewportHeight() {
        if (window.innerWidth <= 767) {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
      }
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(setViewportHeight, 100);
      });
      // Handle Chrome address bar show/hide
      let lastHeight = window.innerHeight;
      window.addEventListener('resize', function() {
        const currentHeight = window.innerHeight;
        if (Math.abs(currentHeight - lastHeight) > 150) {
          setTimeout(setViewportHeight, 100);
          lastHeight = currentHeight;
        }
      });

      // Fallback when /api/chat fails (offline or not configured)
      const KNOWLEDGE = [
        { patterns: ["hi","hello","hey"], responses: ["Hi! How can I help you today? 😊"] },
        { patterns: ["who are you","what are you"], responses: ["I'm General, your AI assistant. What would you like to know?"] },
        { patterns: ["help"], responses: ["Ask a question. Set API keys in Vercel for search and AI."] },
        { patterns: [], responses: ["API not configured. Try 'help' or set keys in Vercel."] }
      ];
      function normalize(t) { return t.replace(/[^\w\s]/g, "").toLowerCase().trim(); }
      function tokenize(t) { return normalize(t).split(/\s+/).filter(Boolean); }
      function scoreMatch(userSet, patternList) { if (!patternList.length) return 0; let n = 0; for (const t of patternList) if (userSet.has(t)) n++; return n / patternList.length; }
      function thinkFallback(msg) {
        const raw = (msg || "").trim();
        if (!raw) return "Ask something.";
        const userSet = new Set(tokenize(raw));
        let best = 0, entry = null;
        for (const e of KNOWLEDGE) { if (!e.patterns.length) continue; for (const p of e.patterns) { const s = scoreMatch(userSet, tokenize(p)); if (s > best) { best = s; entry = e; } } }
        if (entry && best >= 0.3) return entry.responses[0];
        return (KNOWLEDGE.find(e => !e.patterns.length) || {}).responses?.[0] || "No API. Ask 'help'.";
      }

      const COPY_ICON_SVG = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><rect x="5" y="3" width="9" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.4"></rect><rect x="8" y="6" width="9" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.4"></rect></svg>';
      const PDF_ICON_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h2"/><path d="M9 17h2"/><path d="M15 13h2"/><path d="M15 17h2"/></svg>';

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const fileInput = document.getElementById("file-input");
      const fileChosen = document.getElementById("file-chosen");
      const fileNameEl = document.getElementById("file-name");
      const sidebar = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebar-overlay");
      const pastChatsList = document.getElementById("past-chats-list");
      let lastUserMessageEl = null;
      let lastAiMessageEl = null;
      let chosenFile = null;

      var createGenBtn = document.getElementById("create-gen-btn");
      var createGenDropdown = document.getElementById("create-gen-dropdown");
      var createOptImage = document.getElementById("create-opt-image");
      var createOptVideo = document.getElementById("create-opt-video");
      var createGenWrap = document.querySelector(".create-gen-wrap");

      function closeCreateDropdown() {
        if (createGenDropdown) {
          createGenDropdown.classList.remove("open");
          createGenDropdown.setAttribute("aria-hidden", "true");
        }
      }

      if (createGenBtn && createGenDropdown) {
        createGenBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var isOpen = createGenDropdown.classList.toggle("open");
          createGenDropdown.setAttribute("aria-hidden", isOpen ? "false" : "true");
        });
      }
      document.addEventListener("click", function () { closeCreateDropdown(); });
      if (createGenWrap) createGenWrap.addEventListener("click", function (e) { e.stopPropagation(); });

      function showCreateDisabledMessage() {
        var msg = t("createDisabled");
        if (typeof addMessage === "function") {
          addMessage("ai", msg);
        } else {
          alert(msg);
        }
      }

      if (createOptImage) {
        createOptImage.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeCreateDropdown();
          showCreateDisabledMessage();
        });
      }
      if (createOptVideo) {
        createOptVideo.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeCreateDropdown();
          showCreateDisabledMessage();
        });
      }

      function closeSidebar() {
        if (sidebar) sidebar.classList.remove("open");
        if (sidebarOverlay) { sidebarOverlay.classList.remove("visible"); sidebarOverlay.setAttribute("aria-hidden", "true"); }
      }

      function renderPastChats() {
        try {
          if (!pastChatsList) return;
          pastChatsList.innerHTML = "";
          var archive = [];
          try { var r = localStorage.getItem("general_chat_archive"); if (r) { var a = JSON.parse(r); if (Array.isArray(a)) archive = a; } } catch (_) {}
          archive.slice(-5).reverse().forEach(function (entry) {
            var li = document.createElement("li");
            li.className = "general";
            var first = (entry.history && entry.history[0]) ? String(entry.history[0].content || "").trim().slice(0, 28) : "";
            li.textContent = (first || "Chat") + " · " + (entry.createdAt ? new Date(entry.createdAt).toLocaleDateString() : "");
            li.addEventListener("click", (function (session) { return function () {
              if (!session || !session.history || !Array.isArray(session.history)) return;
              history = session.history.slice(0);
              try { localStorage.setItem("general_chat_history", JSON.stringify(history)); } catch (_) {}
              var msgs = chat ? chat.querySelectorAll(".message") : [];
              for (var i = 1; i < msgs.length; i++) { try { msgs[i].remove(); } catch (_) {} }
              session.history.forEach(function (m) { if (m && (m.role === "user" || m.role === "assistant")) addMessage(m.role === "user" ? "user" : "ai", m.content || ""); });
              scheduleRenderHistory();
              closeSidebar();
            }; })(entry));
            pastChatsList.appendChild(li);
          });
        } catch (e) {}
      }

      function scheduleRenderHistory() {
        setTimeout(function () { try { renderPastChats(); } catch (e) {} }, 100);
      }

      fileInput.addEventListener("change", function() {
        chosenFile = fileInput.files?.[0] || null;
        if (chosenFile) { fileNameEl.textContent = chosenFile.name; fileChosen.style.display = ""; }
        else { fileNameEl.textContent = ""; fileChosen.style.display = "none"; }
      });

      function convertTsvBlocksToTables(text) {
        const lines = text.split(/\r?\n/);
        const out = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];
          if (line && line.indexOf("\t") !== -1) {
            const headerCells = line.split("\t").map(c => c.trim()).filter(Boolean);
            if (headerCells.length >= 2) {
              const block = [line];
              let j = i + 1;
              while (j < lines.length && lines[j] && lines[j].indexOf("\t") !== -1) {
                block.push(lines[j]);
                j++;
              }
              if (block.length >= 2) {
                const rows = block.map(l => l.split("\t").map(c => c.trim()));
                const colCount = headerCells.length;
                const headerRow = "| " + headerCells.join(" | ") + " |";
                const sepRow = "| " + headerCells.map(() => "---").join(" | ") + " |";
                const dataRows = rows.slice(1).map(r => {
                  const cells = [];
                  for (let k = 0; k < colCount; k++) {
                    cells.push(r[k] || "");
                  }
                  return "| " + cells.join(" | ") + " |";
                });
                out.push("");
                out.push(headerRow);
                out.push(sepRow);
                dataRows.forEach(r => out.push(r));
                out.push("");
                i = j;
                continue;
              }
            }
          }
          out.push(line);
          i++;
        }
        return out.join("\n");
      }

      function formatMsg(t) {
        if (!t) return "";
        let raw = String(t);

        // First, convert simple tab-separated blocks into proper Markdown tables
        raw = convertTsvBlocksToTables(raw);

        // Escape HTML first
        let s = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        // Detect and convert Markdown tables to HTML tables before other inline formatting
        // We look for blocks that start with a header row and a separator row
        const lines = s.split(/\r?\n/);
        const out = [];
        let i = 0;

        function isTableSeparator(line) {
          return /^\|\s*-[-\s|]*\|\s*$/.test(line);
        }

        function parseTableBlock(start) {
          const headerLine = lines[start];
          const sepLine = lines[start + 1];
          if (!headerLine || !sepLine) return null;
          if (!headerLine.trim().startsWith("|") || !headerLine.trim().endsWith("|")) return null;
          if (!isTableSeparator(sepLine.trim())) return null;

          const tableLines = [headerLine];
          let idx = start + 1;
          while (idx < lines.length) {
            const ln = lines[idx];
            if (!ln.trim()) break;
            if (!ln.trim().startsWith("|") || !ln.trim().endsWith("|")) break;
            tableLines.push(ln);
            idx++;
          }
          if (tableLines.length < 2) return null;

          const headerCells = headerLine.split("|").slice(1, -1).map(c => c.trim());
          const bodyLines = tableLines.slice(2);

          let html = "<table><thead><tr>";
          headerCells.forEach(c => {
            html += "<th>" + c + "</th>";
          });
          html += "</tr></thead><tbody>";

          bodyLines.forEach(rowLine => {
            const cells = rowLine.split("|").slice(1, -1).map(c => c.trim());
            if (cells.length === 0) return;
            html += "<tr>";
            headerCells.forEach((_, idx) => {
              const cell = idx < cells.length ? cells[idx] : "";
              html += "<td>" + cell + "</td>";
            });
            html += "</tr>";
          });

          html += "</tbody></table>";
          return { html, nextIndex: idx };
        }

        while (i < lines.length) {
          const line = lines[i];
          const maybeHeader = line.trim();
          const maybeSep = lines[i + 1] ? lines[i + 1].trim() : "";

          if (
            maybeHeader.startsWith("|") &&
            maybeHeader.endsWith("|") &&
            maybeSep &&
            isTableSeparator(maybeSep)
          ) {
            const tbl = parseTableBlock(i);
            if (tbl) {
              out.push(tbl.html);
              i = tbl.nextIndex;
              continue;
            }
          }

          out.push(line);
          i++;
        }

        s = out.join("\n");

        // Code blocks: wrap fenced code in a white snippet container with its own copy button
        s = s.replace(/```\n?([\s\S]*?)```/g, function (_m, code) {
          return '<div class="ai-snippet"><div class="ai-snippet-header"><span class="ai-snippet-title">Snippet</span><button type="button" class="ai-snippet-copy" aria-label="Copy snippet">'
            + COPY_ICON_SVG +
            '</button></div><div class="ai-snippet-body"><pre><code>' + code +
            '</code></pre></div></div>';
        });
        // Inline code
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        // Bold / italic
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        s = s.replace(/_([^_]+)_/g, "<em>$1</em>");
        // Links
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, txt, url) {
          var u = /^https?:\/\//i.test(url) ? url.replace(/&/g, "&amp;").replace(/"/g, "&quot;") : "#";
          return "<a href=\"" + u + "\" target=\"_blank\" rel=\"noopener\">" + txt + "</a>";
        });
        // Headings and bullet lists
        s = s.replace(/^## (.+)$/gm, "<span class=\"msg-heading\">$1</span>");
        s = s.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
        s = s.replace(/((?:<li>[\s\S]*?<\/li>\n?)+)/g, "<ul>$1</ul>");
        return s;
      }

      function copyToClipboard(text) {
        if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (_) {}
          return;
        }
        navigator.clipboard.writeText(text).catch(function () {});
      }

      function addMessage(role, text, label, opts) {
        const d = document.createElement("div");
        d.className = "message " + role;

        const body = document.createElement("div");
        body.className = "message-body";

        const lbl = document.createElement("span");
        lbl.className = "label";
        lbl.textContent = label || (role === "user" ? t("you") : t("general"));
        body.appendChild(lbl);

        const p = document.createElement("p");
        p.innerHTML = formatMsg(text);
        body.appendChild(p);

        d.appendChild(body);

        if (role === "user" && opts && opts.attachment && opts.attachment.name) {
          const badgeWrap = document.createElement("div");
          badgeWrap.className = "attachment-badge-wrap";
          const badge = document.createElement("div");
          badge.className = "attachment-badge";
          const isPdf = (opts.attachment.type || "").toLowerCase() === "pdf";
          badge.innerHTML = (isPdf ? PDF_ICON_SVG : '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>') + '<span class="attachment-name">' + (opts.attachment.name || "").replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</span>';
          badgeWrap.appendChild(badge);
          d.appendChild(badgeWrap);
        }

        // Add actions for messages, rendered under the bubble
        if (role === "ai") {
          const actions = document.createElement("div");
          actions.className = "message-actions";
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "copy-btn";
          copyBtn.setAttribute("aria-label", "Copy message");
          copyBtn.innerHTML = COPY_ICON_SVG;
          copyBtn.addEventListener("click", function () {
            copyToClipboard(p.innerText || "");
            copyBtn.innerHTML = "✓";
            copyBtn.classList.add("copied");
            setTimeout(function () {
              copyBtn.innerHTML = COPY_ICON_SVG;
              copyBtn.classList.remove("copied");
            }, 2000);
          });
          actions.appendChild(copyBtn);
          d.appendChild(actions);
          lastAiMessageEl = d;
        }

        if (role === "user") {
          const actions = document.createElement("div");
          actions.className = "message-actions";
          // Copy button for user message
          const userCopyBtn = document.createElement("button");
          userCopyBtn.type = "button";
          userCopyBtn.className = "copy-btn";
          userCopyBtn.setAttribute("aria-label", "Copy message");
          userCopyBtn.innerHTML = COPY_ICON_SVG;
          userCopyBtn.addEventListener("click", function () {
            copyToClipboard(p.innerText || "");
            userCopyBtn.innerHTML = "✓";
            userCopyBtn.classList.add("copied");
            setTimeout(function () {
              userCopyBtn.innerHTML = COPY_ICON_SVG;
              userCopyBtn.classList.remove("copied");
            }, 2000);
          });
          actions.appendChild(userCopyBtn);

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "copy-btn";
          editBtn.setAttribute("aria-label", "Edit message");
          const editIcon = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="M4 13.5V16h2.5L15 7.5 12.5 5 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M11 4.5L12.5 3 15 5.5 13.5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>';
          editBtn.innerHTML = editIcon;
          editBtn.addEventListener("click", function () {
            const textContent = p.innerText || "";
            if (!textContent) return;
            // Put original message back into input for editing
            if (input) {
              input.value = textContent;
              input.focus();
            }
            // Remove last user + AI messages from DOM and history
            if (lastAiMessageEl && lastAiMessageEl.parentNode) {
              lastAiMessageEl.parentNode.removeChild(lastAiMessageEl);
            }
            if (lastUserMessageEl && lastUserMessageEl.parentNode) {
              lastUserMessageEl.parentNode.removeChild(lastUserMessageEl);
            }
            if (Array.isArray(history) && history.length >= 2) {
              history.splice(-2, 2);
              try {
                localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20)));
              } catch (_) {}
            }
            lastUserMessageEl = null;
            lastAiMessageEl = null;
          });
          actions.appendChild(editBtn);
          d.appendChild(actions);
          // Ensure only the most recent user message shows an edit button
          if (lastUserMessageEl && lastUserMessageEl !== d) {
            const oldActions = lastUserMessageEl.querySelector(".message-actions");
            if (oldActions && oldActions.parentNode === lastUserMessageEl) {
              lastUserMessageEl.removeChild(oldActions);
            }
          }
          lastUserMessageEl = d;
        }

        // Wire copy buttons for snippet blocks inside AI messages
        if (role === "ai") {
          const snippets = d.querySelectorAll(".ai-snippet");
          snippets.forEach(function (snip) {
            const btn = snip.querySelector(".ai-snippet-copy");
            const body = snip.querySelector(".ai-snippet-body");
            if (!btn || !body) return;
            btn.addEventListener("click", function () {
              const txt = body.innerText || "";
              if (!txt) return;
              copyToClipboard(txt);
              btn.classList.add("copied");
              const original = btn.innerHTML;
              btn.innerHTML = "✓";
              setTimeout(function () {
                btn.innerHTML = COPY_ICON_SVG;
                btn.classList.remove("copied");
              }, 2000);
            });
          });
        }

        chat.appendChild(d);
        requestAnimationFrame(function () { d.scrollIntoView({ behavior: "auto", block: "end" }); });
      }

      /* input is type="text": Enter submits the form by default; no newlines possible */

      function addTyping() {
        const d = document.createElement("div");
        d.className = "message ai typing";
        d.innerHTML = "<span class=\"label\">" + t("general") + "</span><p>" + t("searching") + "</p>";
        chat.appendChild(d);
        requestAnimationFrame(function () { d.scrollIntoView({ behavior: "auto", block: "end" }); });
        return d;
      }

      const MAX_FILE = 3 * 1024 * 1024; // 3 MB (keeps JSON under Vercel 4.5MB)
      function toBase64(buf) {
        const u = new Uint8Array(buf);
        let s = "";
        for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
        return btoa(s);
      }

      if (form && input) form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const raw = input.value.trim();
        const file = chosenFile;
        if (!raw && !file) { input.focus(); return; }
        const displayMsg = raw || (file ? "[" + file.name + "]" : "");
        const attachmentOpts = file ? { attachment: { type: (file.type || "").toLowerCase() === "application/pdf" ? "pdf" : "image", name: file.name } } : undefined;
        if (file && file.size > MAX_FILE) {
          addMessage("user", displayMsg, undefined, attachmentOpts);
          addMessage("ai", "File too large. Use a PDF or image under 3 MB.");
          chosenFile = null; fileInput.value = ""; fileNameEl.textContent = ""; fileChosen.style.display = "none";
          return;
        }
        addMessage("user", displayMsg, undefined, attachmentOpts);
        input.value = "";
        if (file) { chosenFile = null; fileInput.value = ""; fileNameEl.textContent = ""; fileChosen.style.display = "none"; }
        send.disabled = true;
        const typingEl = addTyping();

        try {
          // Image generation command: start message with "image:" (no file attached)
          if (!file && raw && raw.toLowerCase().startsWith("image:")) {
            const prompt = raw.slice(raw.indexOf(":") + 1).trim() || (currentLang === 'de'
              ? "Erzeuge ein illustratives Bild zur Anfrage."
              : "Generate an illustrative image for this request.");
            const imgRes = await fetch("/api/image-generate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt, size: "1024x1024", n: 1 }),
              signal: AbortSignal.timeout(90000)
            });
            let imgData;
            try { imgData = await imgRes.json(); } catch (_) { imgData = { error: "Image request failed." }; }
            const imgReply = imgData && imgData.success && Array.isArray(imgData.images) && imgData.images.length > 0
              ? ((currentLang === 'de'
                    ? "Bild erzeugt:"
                    : "Image generated:") + "\\n\\n![](" + (imgData.images[0].dataUrl || "") + ")")
              : (imgData && imgData.error) ? imgData.error
              : (currentLang === 'de'
                    ? "Es konnte kein Bild erzeugt werden."
                    : "No image could be generated.");
            history.push({ role: "user", content: raw });
            history.push({ role: "assistant", content: imgReply });
            if (typingEl && typingEl.parentNode) {
              typingEl.parentNode.removeChild(typingEl);
            }
            addMessage("ai", imgReply);
            try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch (_) {}
            requestAnimationFrame(function () {
              typingEl.scrollIntoView({ behavior: "auto", block: "end" });
            });
            scheduleRenderHistory();
            return;
          }

          // Video generation (Pixazo): "video: prompt"
          if (!file && raw && raw.toLowerCase().startsWith("video:")) {
            const prompt = raw.slice(raw.indexOf(":") + 1).trim() || (currentLang === 'de'
              ? "Eine kurze Szene mit sanfter Bewegung."
              : "A short scene with gentle motion.");
            const vidRes = await fetch("/api/pixazo-video", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt, duration: 6, resolution: "1080p" }),
              signal: AbortSignal.timeout(300000)
            });
            let vidData;
            try { vidData = await vidRes.json(); } catch (_) { vidData = { error: "Video request failed." }; }
            const vidReply = vidData && vidData.success && vidData.videoUrl
              ? ((currentLang === 'de' ? "Video erzeugt:" : "Video generated:") + "\\n\\n" + (vidData.videoUrl.startsWith("http") ? "[Watch video](" + vidData.videoUrl + ")" : "Video URL: " + vidData.videoUrl))
              : (vidData && vidData.error) ? vidData.error
              : (currentLang === 'de' ? "Es konnte kein Video erzeugt werden." : "No video could be generated.");
            history.push({ role: "user", content: raw });
            history.push({ role: "assistant", content: vidReply });
            if (typingEl && typingEl.parentNode) {
              typingEl.parentNode.removeChild(typingEl);
            }
            addMessage("ai", vidReply);
            try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch (_) {}
            requestAnimationFrame(function () { typingEl.scrollIntoView({ behavior: "auto", block: "end" }); });
            scheduleRenderHistory();
            return;
          }

          const body = { message: raw || (file ? (currentLang === 'de' ? "Was ist in dieser Datei?" : "What is in this file?") : "") };
          if (file) {
            const buf = await file.arrayBuffer();
            const isPdf = (file.type || "").toLowerCase() === "application/pdf";
            if (isPdf) body.pdf = toBase64(buf); else body.image = toBase64(buf);
          }
          body.history = history.slice(-20);
          // Scroll to bottom and ensure form is visible after sending
          setTimeout(function() {
            if (chat) {
              chat.scrollTop = chat.scrollHeight;
            }
            const formWrap = document.querySelector('.form-wrap');
            if (formWrap) {
              formWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
          }, 100);
          const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: AbortSignal.timeout(60000) });
          let data;
          try { data = await res.json(); } catch (_) { data = { reply: "Request failed (" + (res ? res.status : "?") + "). " + (res && res.status === 413 ? "File too large. Use under 3 MB." : "Check /api/chat and DEEPSEEK_API_KEY in Vercel.") }; }
          const reply = (data && data.reply) ? data.reply : (data && data.error) ? data.error : (!res || !res.ok) ? ("Request failed (" + (res ? res.status : "?") + "). Check /api/chat and DEEPSEEK_API_KEY in Vercel.") : "No reply.";
          history.push({ role: "user", content: body.message });
          history.push({ role: "assistant", content: reply });
          // Remove typing element and add proper message with copy button
          if (typingEl && typingEl.parentNode) {
            typingEl.parentNode.removeChild(typingEl);
          }
          addMessage("ai", reply);
          try { localStorage.setItem("general_chat_history", JSON.stringify(history.slice(-20))); } catch (_) {}
          requestAnimationFrame(function () { 
            typingEl.scrollIntoView({ behavior: "auto", block: "end" }); 
            // Ensure form stays visible
            setTimeout(function() {
              const formWrap = document.querySelector('.form-wrap');
              if (formWrap) {
                formWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
              }
            }, 100);
          });
          scheduleRenderHistory();
        } catch (err) {
          var errMsg = (err && err.name === "AbortError") ? "Request timed out. Check your connection and try again." : (file ? "Upload failed. Use a file under 3 MB and set DEEPSEEK_API_KEY in Vercel. Try again." : thinkFallback(displayMsg));
          if (typingEl && typingEl.parentNode) {
            typingEl.parentNode.removeChild(typingEl);
          }
          addMessage("ai", errMsg);
        } finally {
          send.disabled = false;
          setTimeout(function () { 
            if (input) {
              input.focus(); 
              // Ensure form is visible when input is focused
              setTimeout(function() {
                const formWrap = document.querySelector('.form-wrap');
                if (formWrap) {
                  formWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
              }, 300);
            }
          }, 120);
        }
      });

      let history = [];

      // Restore chat from previous session
      try {
        const raw = localStorage.getItem("general_chat_history");
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) {
            history = arr;
            arr.forEach(function (m) {
              if (m && (m.role === "user" || m.role === "assistant")) {
                addMessage(m.role === "user" ? "user" : "ai", m.content || "");
              }
            });
            // Ensure last message pointers are set correctly after restore
            const allMessages = chat ? chat.querySelectorAll(".message") : [];
            if (allMessages.length > 0) {
              for (let i = allMessages.length - 1; i >= 0; i--) {
                const msg = allMessages[i];
                if (msg.classList.contains("user")) {
                  lastUserMessageEl = msg;
                  break;
                }
              }
              for (let i = allMessages.length - 1; i >= 0; i--) {
                const msg = allMessages[i];
                if (msg.classList.contains("ai")) {
                  lastAiMessageEl = msg;
                  break;
                }
              }
            }
          }
        }
      } catch (e) {}
      scheduleRenderHistory();

      var historyBtn = document.getElementById("history-btn");
      if (historyBtn && sidebar) historyBtn.addEventListener("click", function () {
        if (sidebar.classList.contains("open")) { closeSidebar(); return; }
        sidebar.classList.add("open");
        if (sidebarOverlay) { sidebarOverlay.classList.add("visible"); sidebarOverlay.setAttribute("aria-hidden", "false"); }
      });
      if (sidebarOverlay) sidebarOverlay.addEventListener("click", closeSidebar);

      var clearBtn = document.getElementById("clear-chat");
      if (clearBtn) clearBtn.addEventListener("click", function () {
        if (history.length > 0) {
          try {
            var archive = [];
            var raw = localStorage.getItem("general_chat_archive");
            if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) archive = a; }
            archive.push({ history: history.slice(0), createdAt: Date.now() });
            archive = archive.slice(-10);
            localStorage.setItem("general_chat_archive", JSON.stringify(archive));
          } catch (_) {}
        }
        history = [];
        lastUserMessageEl = null;
        lastAiMessageEl = null;
        try { localStorage.removeItem("general_chat_history"); } catch (_) {}
        var msgs = chat ? chat.querySelectorAll(".message") : [];
        for (var i = 1; i < msgs.length; i++) { try { msgs[i].remove(); } catch (_) {} }
        scheduleRenderHistory();
        closeSidebar();
      });

      if (input) input.focus();
    })();
  </script>
</body>
</html>
